<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 680" width="940" height="680">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="940" height="680" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 18. Third Normal Form (3NF) of the SRH LINK-TODA Database Structure</text>
    </g>

    
        <g transform="translate(50, 70)">
            <rect width="220" height="95" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="220" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="110" y="14" text-anchor="middle">roles_3nf</text>
            <text class="node-title" x="8" y="34">PK: role_id</text>
            
            <text class="node-desc" x="8" y="46">role_name</text><text class="node-desc" x="8" y="59">description</text>
        </g>
        <g transform="translate(50, 195)">
            <rect width="220" height="140" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="220" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="110" y="14" text-anchor="middle">users_3nf</text>
            <text class="node-title" x="8" y="34">PK: user_id</text>
            <text class="flow-text" x="8" y="46">FK: role_id</text>
            <text class="node-desc" x="8" y="59">full_name</text><text class="node-desc" x="8" y="72">email</text><text class="node-desc" x="8" y="85">phone</text><text class="node-desc" x="8" y="98">status</text><text class="node-desc" x="8" y="111">created_at</text>
        </g>
        <g transform="translate(340, 70)">
            <rect width="240" height="160" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">drivers_3nf</text>
            <text class="node-title" x="8" y="34">PK: driver_id</text>
            <text class="flow-text" x="8" y="46">FK: user_id</text>
            <text class="node-desc" x="8" y="59">mtop_number</text><text class="node-desc" x="8" y="72">plate_number</text><text class="node-desc" x="8" y="85">license_number</text><text class="node-desc" x="8" y="98">body_number</text><text class="node-desc" x="8" y="111">queue_rank</text><text class="node-desc" x="8" y="124">geofence_status</text>
        </g>
        <g transform="translate(650, 70)">
            <rect width="240" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">terminals_3nf</text>
            <text class="node-title" x="8" y="34">PK: terminal_id</text>
            
            <text class="node-desc" x="8" y="46">terminal_name</text><text class="node-desc" x="8" y="59">anchor_latitude</text><text class="node-desc" x="8" y="72">anchor_longitude</text><text class="node-desc" x="8" y="85">geofence_radius</text>
        </g>
        <g transform="translate(650, 205)">
            <rect width="240" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">tariffs_3nf</text>
            <text class="node-title" x="8" y="34">PK: tariff_rates_3nf</text>
            
            <text class="node-desc" x="8" y="46">base_fare</text><text class="node-desc" x="8" y="59">per_km_rate</text><text class="node-desc" x="8" y="72">night_differential</text><text class="node-desc" x="8" y="85">effective_date</text>
        </g>
        <g transform="translate(340, 260)">
            <rect width="240" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">rides_3nf</text>
            <text class="node-title" x="8" y="34">PK: rides_3nf</text>
            <text class="flow-text" x="8" y="46">FK: passenger_id</text><text class="flow-text" x="8" y="59">FK: driver_id</text><text class="flow-text" x="8" y="72">FK: terminal_id</text><text class="flow-text" x="8" y="85">FK: tariff_id</text>
            <text class="node-desc" x="8" y="98">pickup_coords</text><text class="node-desc" x="8" y="111">dropoff_coords</text><text class="node-desc" x="8" y="124">distance_km</text><text class="node-desc" x="8" y="137">total_fare</text><text class="node-desc" x="8" y="150">ride_status</text><text class="node-desc" x="8" y="163">completed_at</text>
        </g>
        <g transform="translate(50, 365)">
            <rect width="220" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="220" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="110" y="14" text-anchor="middle">messages_3nf</text>
            <text class="node-title" x="8" y="34">PK: chat_messages_3nf</text>
            <text class="flow-text" x="8" y="46">FK: ride_id</text><text class="flow-text" x="8" y="59">FK: sender_id</text>
            <text class="node-desc" x="8" y="72">message_content</text><text class="node-desc" x="8" y="85">is_read</text><text class="node-desc" x="8" y="98">sent_at</text>
        </g>
        <g transform="translate(650, 340)">
            <rect width="240" height="135" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">reports_3nf</text>
            <text class="node-title" x="8" y="34">PK: incident_reports_3nf</text>
            <text class="flow-text" x="8" y="46">FK: ride_id</text><text class="flow-text" x="8" y="59">FK: reporter_id</text>
            <text class="node-desc" x="8" y="72">category</text><text class="node-desc" x="8" y="85">description</text><text class="node-desc" x="8" y="98">status</text><text class="node-desc" x="8" y="111">resolution</text>
        </g>
        <g transform="translate(340, 470)">
            <rect width="240" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">remittance_3nf</text>
            <text class="node-title" x="8" y="34">PK: remittance_ledger_3nf</text>
            <text class="flow-text" x="8" y="46">FK: driver_id</text><text class="flow-text" x="8" y="59">FK: collector_id</text>
            <text class="node-desc" x="8" y="72">daily_dues_amount</text><text class="node-desc" x="8" y="85">receipt_number</text><text class="node-desc" x="8" y="98">payment_date</text>
        </g>
        <g transform="translate(650, 500)">
            <rect width="240" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">logs_3nf</text>
            <text class="node-title" x="8" y="34">PK: audit_logs_3nf</text>
            <text class="flow-text" x="8" y="46">FK: user_id</text>
            <text class="node-desc" x="8" y="59">action_type</text><text class="node-desc" x="8" y="72">payload_json</text><text class="node-desc" x="8" y="85">ip_address</text><text class="node-desc" x="8" y="98">timestamp</text>
        </g>
    <!-- roles_3nf -> users_3nf (Straight down) -->
    <path d="M 160 165 L 160 195" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- users_3nf -> drivers_3nf (In gutter between Col 1 and Col 2) -->
    <path d="M 270 230 L 305 230 L 305 150 L 340 150" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- drivers_3nf -> rides_3nf (Straight down) -->
    <path d="M 460 230 L 460 260" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- terminals_3nf -> rides_3nf (In gutter between Col 2 and Col 3) -->
    <path d="M 650 125 L 615 125 L 615 300 L 580 300" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- tariffs_3nf -> rides_3nf (In gutter between Col 2 and Col 3) -->
    <path d="M 650 260 L 615 260 L 615 350 L 580 350" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- rides_3nf -> messages_3nf (In gutter between Col 1 and Col 2) -->
    <path d="M 340 390 L 305 390 L 305 425 L 270 425" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- rides_3nf -> reports_3nf (Straight horizontal) -->
    <path d="M 580 400 L 650 400" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- drivers_3nf -> remittance_3nf (In gutter between Col 2 and Col 3, NO BOX CUTTING!) -->
    <path d="M 580 190 L 605 190 L 605 530 L 580 530" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- users_3nf -> logs_3nf (Cleanly routes around OUTER PERIMETER, ZERO BOX INTERSECTION!) -->
    <path d="M 50 265 L 20 265 L 20 650 L 770 650 L 770 620" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    
</svg>