<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="960" height="500" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 15. Unnormalized Form (UNF) of the SRH LINK-TODA Data Structure</text>
    </g>

    
    <g transform="translate(60, 70)">
        <rect width="840" height="320" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <rect width="840" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="table-head" x="420" y="19" text-anchor="middle">UNNORMALIZED FORM (UNF) — SRH LINK-TODA MASTER RECORD</text>
        
        <text class="node-title" x="20" y="55">UNF Master Schema Attributes:</text>
        <text class="node-desc" x="25" y="80">• <tspan text-decoration="underline" font-weight="bold">Ride_Transaction_ID</tspan> (Composite Key)</text>
        <text class="node-desc" x="25" y="105">• Commuter_Name, Commuter_Phone, Commuter_Email</text>
        <text class="node-desc" x="25" y="130">• Driver_Name, Driver_Plate, Driver_MTOP, Driver_License, Driver_Queue_Rank</text>
        <text class="node-desc" x="25" y="155">• Terminal_ID, Terminal_Name, Terminal_Lat, Terminal_Lng, Geofence_Radius_35m</text>
        <text class="node-desc" x="25" y="180">• Pickup_Latitude, Pickup_Longitude, Dropoff_Latitude, Dropoff_Longitude, Distance_KM</text>
        <text class="node-desc" x="25" y="205">• Base_Fare, Distance_Rate, Total_Fare_Amount, Ride_Status, Completed_Timestamp</text>
        <text class="node-desc" x="25" y="235" font-style="italic">• Repeating Group: { Message_ID, Sender_ID, Message_Text, Sent_At }</text>
        <text class="node-desc" x="25" y="260" font-style="italic">• Repeating Group: { Incident_ID, Category, Description, Status, Resolution }</text>
        <text class="node-desc" x="25" y="285" font-style="italic">• Repeating Group: { Remittance_ID, Daily_Dues_Amount, Receipt_Number, Payment_Date }</text>
    </g>

    <g transform="translate(60, 410)">
        <rect width="840" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="node-title" x="15" y="22">Normalization Flaws Identified:</text>
        <text class="node-desc" x="15" y="40">Contains multivalued repeating groups and non-atomic composite fields violating First Normal Form (1NF).</text>
    </g>
    
</svg>