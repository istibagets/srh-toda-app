<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="940" height="580">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="940" height="580" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 2. Research Locale and 35-Meter Terminal Geofence Radius Map</text>
    </g>

    
    <!-- Outer Area Box -->
    <rect x="60" y="60" width="820" height="480" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text class="node-title" x="470" y="90" text-anchor="middle">Research Locale: Santa Rosa Homes Tricycle Terminal Area</text>
    <text class="flow-text-center" x="470" y="110">Geographical Coordinates: 15.4247°N, 120.9416°E (Santa Rosa, Nueva Ecija)</text>

    <!-- 35m Geofence Radius Circle -->
    <ellipse cx="470" cy="300" rx="200" ry="160" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text class="table-head" x="470" y="170" text-anchor="middle">35-METER ACTIVE GEOFENCE RADIUS</text>
    <text class="flow-text-center" x="470" y="188">(Automated Duty Check-In &amp; Priority Restoration Zone)</text>

    <!-- Terminal Anchor Box -->
    <rect x="350" y="260" width="240" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text class="table-head" x="470" y="285" text-anchor="middle">SRH TERMINAL ANCHOR POINT</text>
    <text class="flow-text-center" x="470" y="305">Lat: 15.4247°N | Lng: 120.9416°E</text>
    <text class="flow-text-center" x="470" y="325">[ Physical Dispatch Post &amp; Driver Standby Bay ]</text>

    <!-- Road / Entry Lane -->
    <rect x="90" y="275" width="140" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="table-head" x="160" y="295" text-anchor="middle">Terminal Access Road</text>
    <text class="flow-text-center" x="160" y="312">(Tricycle Entry / Exit)</text>

    <!-- Passenger Shed -->
    <rect x="710" y="275" width="140" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="table-head" x="780" y="295" text-anchor="middle">Commuter Shed</text>
    <text class="flow-text-center" x="780" y="312">(Passenger Queue Line)</text>

    <!-- Orthogonal Indicator Lines -->
    <path d="M 230 300 L 270 300" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 590 300 L 710 300" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Compass Rose / North Arrow -->
    <g transform="translate(800, 90)">
        <circle cx="25" cy="25" r="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <line x1="25" y1="40" x2="25" y2="10" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text class="table-head" x="25" y="8" text-anchor="middle">N</text>
    </g>
    
</svg>