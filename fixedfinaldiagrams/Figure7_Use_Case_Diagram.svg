<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 750" width="1150" height="750">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="1150" height="750" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 7. Unified Use Case Diagram for SRH LINK-TODA System</text>
    </g>

    
    <!-- Boundary -->
    <rect x="260" y="50" width="620" height="680" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text class="table-head" x="570" y="75" text-anchor="middle">SRH LINK-TODA System Boundary</text>

    <!-- Actors -->
    <!-- Passenger -->
    <g transform="translate(90, 160)">
        <circle cx="20" cy="15" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <line x1="20" y1="27" x2="20" y2="60" stroke="#000000" stroke-width="1.2"/>
        <line x1="0" y1="40" x2="40" y2="40" stroke="#000000" stroke-width="1.2"/>
        <line x1="20" y1="60" x2="5" y2="85" stroke="#000000" stroke-width="1.2"/>
        <line x1="20" y1="60" x2="35" y2="85" stroke="#000000" stroke-width="1.2"/>
        <text class="entity-title" x="20" y="105">Passenger /</text>
        <text class="entity-title" x="20" y="120">Commuter</text>
    </g>

    <!-- Driver -->
    <g transform="translate(90, 460)">
        <circle cx="20" cy="15" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <line x1="20" y1="27" x2="20" y2="60" stroke="#000000" stroke-width="1.2"/>
        <line x1="0" y1="40" x2="40" y2="40" stroke="#000000" stroke-width="1.2"/>
        <line x1="20" y1="60" x2="5" y2="85" stroke="#000000" stroke-width="1.2"/>
        <line x1="20" y1="60" x2="35" y2="85" stroke="#000000" stroke-width="1.2"/>
        <text class="entity-title" x="20" y="105">Tricycle Driver /</text>
        <text class="entity-title" x="20" y="120">Operator</text>
    </g>

    <!-- Superadmin -->
    <g transform="translate(1000, 300)">
        <circle cx="20" cy="15" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <line x1="20" y1="27" x2="20" y2="60" stroke="#000000" stroke-width="1.2"/>
        <line x1="0" y1="40" x2="40" y2="40" stroke="#000000" stroke-width="1.2"/>
        <line x1="20" y1="60" x2="5" y2="85" stroke="#000000" stroke-width="1.2"/>
        <line x1="20" y1="60" x2="35" y2="85" stroke="#000000" stroke-width="1.2"/>
        <text class="entity-title" x="20" y="105">TODA Official /</text>
        <text class="entity-title" x="20" y="120">Superadmin</text>
    </g>

    <!-- Use Cases -->
    <!-- Col 1 -->
    <g transform="translate(310, 90)"><ellipse cx="115" cy="25" rx="115" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="process-title" x="115" y="29">Register Account &amp; OTP Login</text></g>
    <g transform="translate(310, 180)"><ellipse cx="115" cy="25" rx="115" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="process-title" x="115" y="29">35m Geofence Duty Check-in</text></g>
    <g transform="translate(310, 270)"><ellipse cx="115" cy="25" rx="115" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="process-title" x="115" y="29">Request Ride Dispatch</text></g>
    <g transform="translate(310, 360)"><ellipse cx="120" cy="27" rx="120" ry="27" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/><text class="node-title" x="120" y="32" text-anchor="middle">Priority Recovery Engine</text></g>
    <g transform="translate(310, 450)"><ellipse cx="115" cy="25" rx="115" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="process-title" x="115" y="29">File Incident Blotter Grievance</text></g>
    <g transform="translate(310, 540)"><ellipse cx="115" cy="25" rx="115" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="process-title" x="115" y="29">Calibrate Tariff &amp; Geofence</text></g>

    <!-- Col 2 -->
    <g transform="translate(610, 90)"><ellipse cx="115" cy="25" rx="115" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="process-title" x="115" y="29">Upload MTOP &amp; License Files</text></g>
    <g transform="translate(610, 180)"><ellipse cx="115" cy="25" rx="115" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="process-title" x="115" y="29">Manage Live FIFO Terminal Queue</text></g>
    <g transform="translate(610, 270)"><ellipse cx="115" cy="25" rx="115" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="process-title" x="115" y="29">Calculate Distance Tariff</text></g>
    <g transform="translate(610, 360)"><ellipse cx="115" cy="25" rx="115" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="process-title" x="115" y="29">Stream GPS Telemetry &amp; Chat</text></g>
    <g transform="translate(610, 450)"><ellipse cx="115" cy="25" rx="115" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="process-title" x="115" y="29">Record Daily Remittance Dues</text></g>
    <g transform="translate(610, 540)"><ellipse cx="115" cy="25" rx="115" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="process-title" x="115" y="29">Audit Immutable System Logs</text></g>

    <!-- Association Lines (Strictly Orthogonal) -->
    <!-- Passenger Lines -->
    <path d="M 130 190 L 220 190 L 220 115 L 310 115" fill="none" stroke="#000000" stroke-width="1"/>
    <path d="M 130 205 L 220 205 L 220 295 L 310 295" fill="none" stroke="#000000" stroke-width="1"/>
    <path d="M 130 220 L 200 220 L 200 385 L 610 385" fill="none" stroke="#000000" stroke-width="1"/>
    <path d="M 130 235 L 180 235 L 180 475 L 310 475" fill="none" stroke="#000000" stroke-width="1"/>

    <!-- Driver Lines -->
    <path d="M 130 480 L 200 480 L 200 205 L 310 205" fill="none" stroke="#000000" stroke-width="1"/>
    <path d="M 130 495 L 220 495 L 220 385 L 310 385" fill="none" stroke="#000000" stroke-width="1"/>
    <path d="M 130 510 L 240 510 L 240 475 L 610 475" fill="none" stroke="#000000" stroke-width="1"/>
    <path d="M 130 525 L 250 525 L 250 115 L 610 115" fill="none" stroke="#000000" stroke-width="1"/>

    <!-- Superadmin Lines -->
    <path d="M 1000 330 L 910 330 L 910 205 L 840 205" fill="none" stroke="#000000" stroke-width="1"/>
    <path d="M 1000 345 L 930 345 L 930 295 L 840 295" fill="none" stroke="#000000" stroke-width="1"/>
    <path d="M 1000 360 L 910 360 L 910 475 L 840 475" fill="none" stroke="#000000" stroke-width="1"/>
    <path d="M 1000 375 L 930 375 L 930 565 L 840 565" fill="none" stroke="#000000" stroke-width="1"/>
    <path d="M 1000 390 L 950 390 L 950 630 L 425 630 L 425 590" fill="none" stroke="#000000" stroke-width="1"/>
    
</svg>