<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 740" width="1040" height="740">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="1040" height="740" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 19. System Class Diagram and Domain Object Relationships</text>
    </g>

    
        <g transform="translate(60, 80)">
            <rect width="240" height="170" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="15" text-anchor="middle">User</text>
            <text class="node-desc" x="8" y="36">+ id: int</text><text class="node-desc" x="8" y="49">+ name: string</text><text class="node-desc" x="8" y="62">+ email: string</text><text class="node-desc" x="8" y="75">+ contact_number: string</text><text class="node-desc" x="8" y="88">+ role: string</text><text class="node-desc" x="8" y="101">+ is_active: bool</text>
            <line x1="0" y1="118" x2="240" y2="118" stroke="#000000" stroke-width="1"/>
            <text class="flow-text" x="8" y="131">+ isVerified(): bool</text><text class="flow-text" x="8" y="144">+ getAvatarUrl(): string</text><text class="flow-text" x="8" y="157">+ getAverageRating(): float</text>
        </g>
        <g transform="translate(360, 80)">
            <rect width="260" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="260" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="130" y="15" text-anchor="middle">Driver</text>
            <text class="node-desc" x="8" y="36">+ id: int</text><text class="node-desc" x="8" y="49">+ user_id: int</text><text class="node-desc" x="8" y="62">+ mtop_number: string</text><text class="node-desc" x="8" y="75">+ plate_number: string</text><text class="node-desc" x="8" y="88">+ compliance_status: string</text><text class="node-desc" x="8" y="101">+ is_online: bool</text><text class="node-desc" x="8" y="114">+ queue_position: int</text>
            <line x1="0" y1="131" x2="260" y2="131" stroke="#000000" stroke-width="1"/>
            <text class="flow-text" x="8" y="144">+ rides(): HasMany</text><text class="flow-text" x="8" y="157">+ getAverageRating(): float</text><text class="flow-text" x="8" y="170">+ isCompliant(): bool</text>
        </g>
        <g transform="translate(680, 80)">
            <rect width="290" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="290" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="145" y="15" text-anchor="middle">QueueService</text>
            <text class="node-desc" x="8" y="36">- lastNormalizedAt: Carbon</text><text class="node-desc" x="8" y="49">- broadcastChannel: string</text>
            <line x1="0" y1="66" x2="290" y2="66" stroke="#000000" stroke-width="1"/>
            <text class="flow-text" x="8" y="79">+ removeAndShift(driver: Driver): void</text><text class="flow-text" x="8" y="92">+ insertAtFront(driver: Driver): void</text><text class="flow-text" x="8" y="105">+ normalizeQueue(): void</text><text class="flow-text" x="8" y="118">+ reorderQueue(orderedIds: array): void</text><text class="flow-text" x="8" y="131">- notifyQueueChanged(): void</text>
        </g>
        <g transform="translate(360, 330)">
            <rect width="260" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="260" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="130" y="15" text-anchor="middle">Ride</text>
            <text class="node-desc" x="8" y="36">+ id: int</text><text class="node-desc" x="8" y="49">+ passenger_id: int</text><text class="node-desc" x="8" y="62">+ driver_id: int</text><text class="node-desc" x="8" y="75">+ fare: decimal</text><text class="node-desc" x="8" y="88">+ proposed_fare: decimal</text><text class="node-desc" x="8" y="101">+ distance_km: decimal</text><text class="node-desc" x="8" y="114">+ status: string</text>
            <line x1="0" y1="131" x2="260" y2="131" stroke="#000000" stroke-width="1"/>
            <text class="flow-text" x="8" y="144">+ passenger(): BelongsTo</text><text class="flow-text" x="8" y="157">+ driver(): BelongsTo</text><text class="flow-text" x="8" y="170">+ chatMessages(): HasMany</text><text class="flow-text" x="8" y="183">+ reports(): HasMany</text>
        </g>
        <g transform="translate(60, 330)">
            <rect width="240" height="140" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="15" text-anchor="middle">ChatMessage</text>
            <text class="node-desc" x="8" y="36">+ id: int</text><text class="node-desc" x="8" y="49">+ ride_id: int</text><text class="node-desc" x="8" y="62">+ sender_id: int</text><text class="node-desc" x="8" y="75">+ message: string</text><text class="node-desc" x="8" y="88">+ is_read: bool</text>
            <line x1="0" y1="105" x2="240" y2="105" stroke="#000000" stroke-width="1"/>
            <text class="flow-text" x="8" y="118">+ ride(): BelongsTo</text><text class="flow-text" x="8" y="131">+ sender(): BelongsTo</text>
        </g>
        <g transform="translate(680, 330)">
            <rect width="260" height="160" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="260" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="130" y="15" text-anchor="middle">Report</text>
            <text class="node-desc" x="8" y="36">+ id: int</text><text class="node-desc" x="8" y="49">+ reporter_id: int</text><text class="node-desc" x="8" y="62">+ driver_id: int</text><text class="node-desc" x="8" y="75">+ ride_id: int</text><text class="node-desc" x="8" y="88">+ type: string</text><text class="node-desc" x="8" y="101">+ status: string</text>
            <line x1="0" y1="118" x2="260" y2="118" stroke="#000000" stroke-width="1"/>
            <text class="flow-text" x="8" y="131">+ reporter(): BelongsTo</text><text class="flow-text" x="8" y="144">+ driver(): BelongsTo</text><text class="flow-text" x="8" y="157">+ ride(): BelongsTo</text>
        </g>
        <g transform="translate(360, 560)">
            <rect width="260" height="150" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="260" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="130" y="15" text-anchor="middle">RemittanceLedger</text>
            <text class="node-desc" x="8" y="36">+ id: int</text><text class="node-desc" x="8" y="49">+ driver_id: int</text><text class="node-desc" x="8" y="62">+ collector_id: int</text><text class="node-desc" x="8" y="75">+ amount: decimal</text><text class="node-desc" x="8" y="88">+ receipt_number: string</text><text class="node-desc" x="8" y="101">+ payment_date: date</text>
            <line x1="0" y1="118" x2="260" y2="118" stroke="#000000" stroke-width="1"/>
            <text class="flow-text" x="8" y="131">+ driver(): BelongsTo</text><text class="flow-text" x="8" y="144">+ collector(): BelongsTo</text>
        </g>
        <g transform="translate(680, 540)">
            <rect width="260" height="150" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="260" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="130" y="15" text-anchor="middle">ActivityLog</text>
            <text class="node-desc" x="8" y="36">+ id: int</text><text class="node-desc" x="8" y="49">+ user_id: int</text><text class="node-desc" x="8" y="62">+ action: string</text><text class="node-desc" x="8" y="75">+ ip_address: string</text><text class="node-desc" x="8" y="88">+ payload_hash: string</text>
            <line x1="0" y1="105" x2="260" y2="105" stroke="#000000" stroke-width="1"/>
            <text class="flow-text" x="8" y="118">+ user(): BelongsTo</text><text class="flow-text" x="8" y="131">+ verifyHash(): bool</text>
        </g>
    <!-- User -> Driver (Straight horizontal) -->
    <path d="M 300 150 L 360 150" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text class="flow-text-center" x="330" y="142">1..1</text>

    <!-- Driver -> QueueService (Straight horizontal) -->
    <path d="M 620 150 L 680 150" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text class="flow-text-center" x="650" y="142">1..*</text>

    <!-- Driver -> Ride (Straight vertical) -->
    <path d="M 490 270 L 490 330" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text class="flow-text" x="495" y="300">1..*</text>

    <!-- Ride -> ChatMessage (Straight horizontal) -->
    <path d="M 360 400 L 300 400" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text class="flow-text-center" x="330" y="392">1..*</text>

    <!-- Ride -> Report (Straight horizontal) -->
    <path d="M 620 400 L 680 400" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text class="flow-text-center" x="650" y="392">0..*</text>

    <!-- Ride -> Remittance (Straight vertical) -->
    <path d="M 490 520 L 490 560" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text class="flow-text" x="495" y="545">1..*</text>

    <!-- Report -> ActivityLog (Straight vertical) -->
    <path d="M 810 490 L 810 540" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text class="flow-text" x="815" y="520">1..*</text>
    
</svg>