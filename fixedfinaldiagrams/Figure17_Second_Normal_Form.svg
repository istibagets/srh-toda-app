            <rect width="230" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="115" y="14" text-anchor="middle">tariffs_2nf</text>
            <text class="node-title" x="8" y="34">PK: tariff_id</text>
            <text class="node-desc" x="8" y="48">base_fare</text><text class="node-desc" x="8" y="61">per_km_rate</text><text class="node-desc" x="8" y="74">effective_date</text>
        </g>
        <g transform="translate(50, 220)">
