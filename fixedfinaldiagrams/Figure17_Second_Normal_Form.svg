            <rect width="250" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="125" y="14" text-anchor="middle">rides_2nf</text>
            <text class="node-title" x="8" y="34">PK: ride_id</text>
            <text class="node-desc" x="8" y="48">passenger_id (FK)</text><text class="node-desc" x="8" y="61">driver_id (FK)</text><text class="node-desc" x="8" y="74">pickup_lat</text><text class="node-desc" x="8" y="87">pickup_lng</text><text class="node-desc" x="8" y="100">dropoff_lat</text><text class="node-desc" x="8" y="113">dropoff_lng</text><text class="node-desc" x="8" y="126">distance_km</text><text class="node-desc" x="8" y="139">fare_amount</text><text class="node-desc" x="8" y="152">status</text>
        </g>
        <g transform="translate(330, 220)">
            <rect width="230" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="230" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="115" y="14" text-anchor="middle">chat_messages_2nf</text>
            <text class="node-title" x="8" y="34">PK: message_id</text>
            <text class="node-desc" x="8" y="48">ride_id (FK)</text><text class="node-desc" x="8" y="61">sender_id (FK)</text><text class="node-desc" x="8" y="74">message_text</text><text class="node-desc" x="8" y="87">sent_at</text>
        </g>
        <g transform="translate(600, 200)">
            <rect width="230" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="230" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="115" y="14" text-anchor="middle">incident_reports_2nf</text>
            <text class="node-title" x="8" y="34">PK: report_id</text>
            <text class="node-desc" x="8" y="48">ride_id (FK)</text><text class="node-desc" x="8" y="61">reporter_id (FK)</text><text class="node-desc" x="8" y="74">category</text><text class="node-desc" x="8" y="87">description</text><text class="node-desc" x="8" y="100">status</text>
        </g>
        <g transform="translate(330, 350)">
            <rect width="230" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="230" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="115" y="14" text-anchor="middle">remittance_ledger_2nf</text>
            <text class="node-title" x="8" y="34">PK: remittance_id</text>
            <text class="node-desc" x="8" y="48">driver_id (FK)</text><text class="node-desc" x="8" y="61">daily_dues_amount</text><text class="node-desc" x="8" y="74">receipt_no</text><text class="node-desc" x="8" y="87">payment_date</text>
        </g>
        <g transform="translate(600, 340)">
            <rect width="230" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="230" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="115" y="14" text-anchor="middle">audit_logs_2nf</text>
            <text class="node-title" x="8" y="34">PK: log_id</text>
            <text class="node-desc" x="8" y="48">user_id (FK)</text><text class="node-desc" x="8" y="61">action_type</text><text class="node-desc" x="8" y="74">ip_address</text><text class="node-desc" x="8" y="87">timestamp</text>
        </g>
    <g transform="translate(50, 480)">
        <rect width="780" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="node-title" x="15" y="22">2NF Compliance Status:</text>
        <text class="node-desc" x="15" y="40">Eliminated all partial key dependencies; each non-key attribute is fully functionally dependent on primary key. Transitive dependencies resolved in 3NF.</text>
    </g>
</svg>