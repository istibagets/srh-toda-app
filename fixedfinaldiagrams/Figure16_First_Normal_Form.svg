<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="920" height="400" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 16. First Normal Form (1NF) of the SRH LINK-TODA Database Structure</text>
    </g>

    
        <g transform="translate(50, 70)">
            <rect width="280" height="210" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="280" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="140" y="14" text-anchor="middle">rides_1nf</text>
            <text class="node-title" x="8" y="34">PK: ride_id</text>
            <text class="node-desc" x="8" y="48">passenger_name</text><text class="node-desc" x="8" y="61">passenger_phone</text><text class="node-desc" x="8" y="74">driver_name</text><text class="node-desc" x="8" y="87">driver_plate</text><text class="node-desc" x="8" y="100">driver_mtop</text><text class="node-desc" x="8" y="113">terminal_anchor</text><text class="node-desc" x="8" y="126">pickup_coords</text><text class="node-desc" x="8" y="139">dropoff_coords</text><text class="node-desc" x="8" y="152">distance_km</text><text class="node-desc" x="8" y="165">fare_amount</text><text class="node-desc" x="8" y="178">status</text>
        </g>
        <g transform="translate(360, 70)">
            <rect width="240" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">chat_messages_1nf</text>
            <text class="node-title" x="8" y="34">PK: message_id, ride_id</text>
            <text class="node-desc" x="8" y="48">sender_name</text><text class="node-desc" x="8" y="61">message_content</text><text class="node-desc" x="8" y="74">sent_at</text>
        </g>
        <g transform="translate(630, 70)">
            <rect width="240" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">incident_reports_1nf</text>
            <text class="node-title" x="8" y="34">PK: report_id, ride_id</text>
            <text class="node-desc" x="8" y="48">reporter_name</text><text class="node-desc" x="8" y="61">category</text><text class="node-desc" x="8" y="74">description</text><text class="node-desc" x="8" y="87">status</text>
        </g>
        <g transform="translate(360, 190)">
            <rect width="240" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">remittance_ledger_1nf</text>
            <text class="node-title" x="8" y="34">PK: remittance_id, driver_mtop</text>
            <text class="node-desc" x="8" y="48">daily_dues</text><text class="node-desc" x="8" y="61">receipt_num</text><text class="node-desc" x="8" y="74">payment_date</text>
        </g>
        <g transform="translate(630, 190)">
            <rect width="240" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">audit_logs_1nf</text>
            <text class="node-title" x="8" y="34">PK: log_id</text>
            <text class="node-desc" x="8" y="48">user_name</text><text class="node-desc" x="8" y="61">action_type</text><text class="node-desc" x="8" y="74">ip_address</text><text class="node-desc" x="8" y="87">timestamp</text>
        </g>
    <g transform="translate(50, 310)">
        <rect width="820" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="node-title" x="15" y="22">1NF Compliance Status:</text>
        <text class="node-desc" x="15" y="40">Eliminated all repeating groups into distinct relations. Redundant passenger &amp; driver descriptors remain (Partial Dependencies exist).</text>
    </g>
</svg>