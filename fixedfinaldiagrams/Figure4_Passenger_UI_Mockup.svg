<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="480" height="640" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 4. Passenger Progressive Web Application (PWA) Interface Mockup</text>
    </g>

    
    <rect x="60" y="60" width="340" height="540" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="75" y="90" width="310" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="table-head" x="230" y="115" text-anchor="middle">SRH LINK-TODA (Commuter)</text>

    <rect x="75" y="140" width="310" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="node-title" x="90" y="162">Live Terminal Standby Queue</text>
    <text class="node-desc" x="90" y="184">14 Tricycles Active &#8226; Est. Wait: 2 Mins</text>

    <rect x="75" y="210" width="310" height="170" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="4,4"/>
    <text class="flow-text-center" x="230" y="290">[ MapLibre GL Vector Map View ]</text>
    <text class="flow-text-center" x="230" y="310">Pickup: SRH Terminal &#8594; Drop-off: Select Destination</text>

    <rect x="75" y="390" width="310" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="node-title" x="90" y="412">Distance: 2.80 km</text>
    <text class="table-head" x="90" y="430">Computed Fare: PHP 45.00</text>

    <rect x="75" y="450" width="310" height="45" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text class="table-head" x="230" y="478" text-anchor="middle">REQUEST RIDE DISPATCH</text>

    <rect x="75" y="505" width="310" height="35" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="flow-text-center" x="230" y="527">Queue | Active Trip | Chat | Blotter | Profile</text>
    
</svg>