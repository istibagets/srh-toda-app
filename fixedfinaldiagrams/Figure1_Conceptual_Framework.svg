<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 800" width="1140" height="800">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="1140" height="800" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 1. Conceptual Framework for SRH LINK-TODA (IPO Model + Agile SDLC)</text>
    </g>

    
    <!-- Problem Statement Box -->
    <g transform="translate(50, 70)">
        <rect width="330" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <text class="table-head" x="165" y="24" text-anchor="middle">PROBLEM STATEMENT</text>
        <line x1="12" y1="32" x2="318" y2="32" stroke="#000000" stroke-width="1"/>
        <text class="node-desc" x="16" y="58">• Unregulated physical terminal queue congestion</text>
        <text class="node-desc" x="16" y="83">• Passenger queue anxiety &amp; lack of queue visibility</text>
        <text class="node-desc" x="16" y="108">• Reliance on manual single keypad phone communication</text>
        <text class="node-desc" x="16" y="133">• Arbitrary driver overcharging &amp; fragmented paper ledgers</text>
    </g>

    <!-- Input Requirements Box -->
    <g transform="translate(760, 70)">
        <rect width="330" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <text class="table-head" x="165" y="24" text-anchor="middle">INPUT REQUIREMENTS &amp; STANDARDS</text>
        <line x1="12" y1="32" x2="318" y2="32" stroke="#000000" stroke-width="1"/>
        <text class="node-desc" x="16" y="54">• Decoupled PWA (Ionic Angular + Laravel 11)</text>
        <text class="node-desc" x="16" y="76">• HTML5 Geolocation API &amp; MapLibre GL Vector Map</text>
        <text class="node-desc" x="16" y="98">• 35m Terminal Geofence Anchor (15.4247°N, 120.9416°E)</text>
        <text class="node-desc" x="16" y="120">• Priority Queue Algorithm &amp; Distance Tariff Matrix</text>
        <text class="node-desc" x="16" y="142">• Municipal MTOP Franchising Guidelines</text>
        <text class="node-desc" x="16" y="164">• ISO/IEC 25010:2023 Systems Quality Model</text>
    </g>

    <!-- Process Box (Agile Scrum SDLC Engine) -->
    <g transform="translate(180, 300)">
        <rect width="780" height="210" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
        <text class="table-head" x="390" y="24" text-anchor="middle">PROCESS: AGILE SCRUM SYSTEM DEVELOPMENT LIFE CYCLE (SDLC)</text>
        <line x1="15" y1="34" x2="765" y2="34" stroke="#000000" stroke-width="1"/>
        <g transform="translate(20, 52)">
            <text class="node-title" x="0" y="15">Phase 1: Requirement Analysis</text>
            <text class="node-desc" x="15" y="32">User stories elicitation, terminal observations &amp; pain point mapping</text>
            <text class="node-title" x="0" y="54">Phase 2: Design</text>
            <text class="node-desc" x="15" y="71">System architecture, 3NF schema, DFDs, ERD &amp; responsive UI wireframes</text>
            <text class="node-title" x="0" y="93">Phase 3: Implementation</text>
            <text class="node-desc" x="15" y="110">Ionic PWA, Laravel 11 REST API, Reverb :8080 &amp; Priority Recovery Engine</text>
            
            <text class="node-title" x="400" y="15">Phase 4: Testing</text>
            <text class="node-desc" x="415" y="32">Haversine 35m GPS boundary verification, WebSocket latency &#8804; 200ms</text>
            <text class="node-title" x="400" y="54">Phase 5: Deployment</text>
            <text class="node-desc" x="415" y="71">Real-world pilot testing at Santa Rosa Homes terminal with live drivers</text>
            <text class="node-title" x="400" y="93">Phase 6: Maintenance &amp; Evaluation</text>
            <text class="node-desc" x="415" y="110">ISO/IEC 25010:2023 technical evaluation by IT Experts &amp; End-Users</text>
        </g>
    </g>

    <!-- Output Box -->
    <g transform="translate(170, 560)">
        <rect width="800" height="135" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <text class="table-head" x="400" y="24" text-anchor="middle">OUTPUT: DEPLOYED SRH LINK-TODA PWA PLATFORM</text>
        <line x1="15" y1="32" x2="785" y2="32" stroke="#000000" stroke-width="1"/>
        <text class="node-desc" x="20" y="54">• Commuter PWA: Real-time terminal standby queue display &amp; distance-metered booking</text>
        <text class="node-desc" x="20" y="74">• Driver Terminal PWA: HTML5 35m GPS duty check-in &amp; Priority Recovery Engine (Auto #1 Slot)</text>
        <text class="node-desc" x="20" y="94">• TODA Dispatcher &amp; Superadmin Hub: Queue overrides, MTOP compliance, remittance ledger &amp; audit trails</text>
        <text class="node-desc" x="20" y="114">• Validated Software Quality: ISO/IEC 25010:2023 Overall Mean: 4.88 (Excellent Quality Standards)</text>
    </g>

    <!-- Feedback Loop -->
    <g transform="translate(170, 730)">
        <rect width="800" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="node-title" x="400" y="25" text-anchor="middle">FEEDBACK LOOP: Post-Deployment Refinements Based on ISO/IEC 25010 Ratings &amp; Telemetry Logs</text>
    </g>

    <!-- Connectors: Strictly 90-degree right angles -->
    <path d="M 215 250 L 215 300" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 925 250 L 925 300" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 570 510 L 570 560" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 570 695 L 570 730" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    
    <!-- Clean Feedback Loop Routing on Outside Margin: ZERO OVERLAP WITH TEXT OR BOXES -->
    <path d="M 170 750 L 30 750 L 30 535 L 260 535 L 260 510" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    
</svg>