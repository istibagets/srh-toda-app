<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="960" height="460" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 10. Level 2 Data Flow Diagram of Process 1.0 – Manage Authentication</text>
    </g>

    
        <g transform="translate(60, 160)"><rect width="140" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="entity-title" x="70" y="36">USER</text></g>
        <g transform="translate(320, 80)"><rect width="240" height="50" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="0" y1="18" x2="240" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="120" y="14">1.1</text><text class="process-title" x="120" y="36">Receive Email &amp; Contact Info</text></g>
        <g transform="translate(320, 170)"><rect width="240" height="50" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="0" y1="18" x2="240" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="120" y="14">1.2</text><text class="process-title" x="120" y="36">Generate 6-Digit OTP Token</text></g>
        <g transform="translate(320, 260)"><rect width="240" height="50" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="0" y1="18" x2="240" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="120" y="14">1.3</text><text class="process-title" x="120" y="36">Validate Token &amp; Issue Sanctum</text></g>
        <g transform="translate(320, 350)"><rect width="240" height="50" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="0" y1="18" x2="240" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="120" y="14">1.4</text><text class="process-title" x="120" y="36">Load Role Permissions</text></g>

        <!-- Datastores (3-sided open right) -->
        <g transform="translate(680, 170)">
            <path d="M 200 0 L 0 0 L 0 45 L 200 45" fill="none" stroke="#000000" stroke-width="1.2"/>
            <line x1="40" y1="0" x2="40" y2="45" stroke="#000000" stroke-width="1.2"/>
            <text class="store-id" x="20" y="27">D1</text><text class="store-name" x="50" y="27">users_3nf</text>
        </g>
        <g transform="translate(680, 350)">
            <path d="M 200 0 L 0 0 L 0 45 L 200 45" fill="none" stroke="#000000" stroke-width="1.2"/>
            <line x1="40" y1="0" x2="40" y2="45" stroke="#000000" stroke-width="1.2"/>
            <text class="store-id" x="20" y="27">D6</text><text class="store-name" x="50" y="27">activity_logs_3nf</text>
        </g>

        <!-- 90-degree lines -->
        <path d="M 200 170 L 260 170 L 260 105 L 320 105" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <text class="flow-text" x="210" y="165">Email Address</text>

        <path d="M 440 130 L 440 170" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 320 195 L 200 195" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <text class="flow-text" x="210" y="190">Deliver OTP</text>

        <path d="M 200 205 L 260 205 L 260 285 L 320 285" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <text class="flow-text" x="210" y="225">Submit OTP</text>

        <path d="M 560 285 L 620 285 L 620 192 L 680 192" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 440 310 L 440 350" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 560 375 L 680 375" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    
</svg>