<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" width="1120" height="740">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="1120" height="740" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 7. System Use Case Diagram (SRH LINK-TODA System)</text>
    </g>

    
    <!-- Boundary -->
    <rect x="260" y="50" width="620" height="660" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text class="header-text" x="570" y="75">SRH LINK-TODA SYSTEM BOUNDARY (PWA)</text>

    <!-- Passenger -->
    <g transform="translate(60, 160)">
        <circle cx="25" cy="15" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
        <line x1="25" y1="27" x2="25" y2="60" stroke="#000000" stroke-width="1.5"/>
        <line x1="5" y1="40" x2="45" y2="40" stroke="#000000" stroke-width="1.5"/>
        <line x1="25" y1="60" x2="10" y2="90" stroke="#000000" stroke-width="1.5"/>
        <line x1="25" y1="60" x2="40" y2="90" stroke="#000000" stroke-width="1.5"/>
        <text class="entity-title" x="25" y="110">PASSENGER /</text>
        <text class="entity-title" x="25" y="125">COMMUTER</text>
    </g>

    <!-- Driver -->
    <g transform="translate(60, 460)">
        <circle cx="25" cy="15" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
        <line x1="25" y1="27" x2="25" y2="60" stroke="#000000" stroke-width="1.5"/>
        <line x1="5" y1="40" x2="45" y2="40" stroke="#000000" stroke-width="1.5"/>
        <line x1="25" y1="60" x2="10" y2="90" stroke="#000000" stroke-width="1.5"/>
        <line x1="25" y1="60" x2="40" y2="90" stroke="#000000" stroke-width="1.5"/>
        <text class="entity-title" x="25" y="110">TRICYCLE DRIVER /</text>
        <text class="entity-title" x="25" y="125">OPERATOR</text>
    </g>

    <!-- Admin -->
    <g transform="translate(980, 300)">
        <circle cx="25" cy="15" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
        <line x1="25" y1="27" x2="25" y2="60" stroke="#000000" stroke-width="1.5"/>
        <line x1="5" y1="40" x2="45" y2="40" stroke="#000000" stroke-width="1.5"/>
        <line x1="25" y1="60" x2="10" y2="90" stroke="#000000" stroke-width="1.5"/>
        <line x1="25" y1="60" x2="40" y2="90" stroke="#000000" stroke-width="1.5"/>
        <text class="entity-title" x="25" y="110">TODA OFFICIAL /</text>
        <text class="entity-title" x="25" y="125">SUPERADMIN</text>
    </g>

    <!-- Ovals -->
    <!-- Row 1 -->
    <ellipse cx="410" cy="110" rx="120" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text class="flow-text-center" x="410" y="114">Register &amp; OTP Login</text>

    <ellipse cx="730" cy="110" rx="120" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text class="flow-text-center" x="730" y="114">Upload MTOP &amp; License Files</text>

    <!-- Row 2 -->
    <ellipse cx="410" cy="190" rx="120" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text class="flow-text-center" x="410" y="194">35m Geofence Duty Check-in</text>

    <ellipse cx="730" cy="190" rx="120" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text class="flow-text-center" x="730" y="194">Manage Live FIFO Queue</text>

    <!-- Row 3 -->
    <ellipse cx="410" cy="275" rx="120" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text class="flow-text-center" x="410" y="279">Request Ride Dispatch</text>

    <ellipse cx="730" cy="275" rx="120" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text class="flow-text-center" x="730" y="279">Calculate Distance Tariff</text>

    <!-- Row 4 -->
    <ellipse cx="410" cy="365" rx="130" ry="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text class="node-title" x="410" y="362" text-anchor="middle">Priority Queue Recovery Engine</text>
    <text class="flow-text-center" x="410" y="376">(Auto-reinstate victim to #1 slot)</text>

    <ellipse cx="730" cy="365" rx="120" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text class="flow-text-center" x="730" y="369">Stream Telemetry &amp; Chat</text>

    <!-- Row 5 -->
    <ellipse cx="410" cy="455" rx="120" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text class="flow-text-center" x="410" y="459">File Grievance Blotter</text>

    <ellipse cx="730" cy="455" rx="120" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text class="flow-text-center" x="730" y="459">Record Daily Remittance Dues</text>

    <!-- Row 6 -->
    <ellipse cx="410" cy="545" rx="120" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text class="flow-text-center" x="410" y="549">Calibrate Tariff &amp; Geofence</text>

    <ellipse cx="730" cy="545" rx="120" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text class="flow-text-center" x="730" y="549">Audit Immutable System Logs</text>

    <!-- Associations (Passenger) -->
    <line x1="110" y1="190" x2="290" y2="115" stroke="#000000" stroke-width="1"/>
    <line x1="110" y1="200" x2="290" y2="275" stroke="#000000" stroke-width="1"/>
    <line x1="110" y1="210" x2="615" y2="365" stroke="#000000" stroke-width="1"/>
    <line x1="110" y1="220" x2="295" y2="450" stroke="#000000" stroke-width="1"/>

    <!-- Associations (Driver) -->
    <line x1="110" y1="480" x2="290" y2="115" stroke="#000000" stroke-width="1"/>
    <line x1="110" y1="490" x2="610" y2="115" stroke="#000000" stroke-width="1"/>
    <line x1="110" y1="500" x2="290" y2="190" stroke="#000000" stroke-width="1"/>
    <line x1="110" y1="510" x2="290" y2="275" stroke="#000000" stroke-width="1"/>
    <line x1="110" y1="520" x2="280" y2="365" stroke="#000000" stroke-width="1.2"/>
    <line x1="110" y1="530" x2="615" y2="455" stroke="#000000" stroke-width="1"/>

    <!-- Associations (Admin) -->
    <line x1="980" y1="330" x2="850" y2="115" stroke="#000000" stroke-width="1"/>
    <line x1="980" y1="340" x2="850" y2="190" stroke="#000000" stroke-width="1"/>
    <line x1="980" y1="350" x2="850" y2="455" stroke="#000000" stroke-width="1"/>
    <line x1="980" y1="360" x2="850" y2="545" stroke="#000000" stroke-width="1"/>
    <line x1="980" y1="370" x2="530" y2="545" stroke="#000000" stroke-width="1"/>

    <!-- <<extend>> connectors -->
    <path d="M 530 275 L 610 275" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text class="flow-text-center" x="570" y="268">&lt;&lt;include&gt;&gt;</text>

    <path d="M 410 337 L 410 300" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text class="flow-text" x="415" y="322">&lt;&lt;extend&gt;&gt;</text>
    
</svg>