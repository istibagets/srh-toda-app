<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="960" height="640" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 13. Level 2 Data Flow Diagram of Process 4.0 – Dispatch Ride &amp; Priority Recovery</text>
    </g>

    
        <g transform="translate(60, 110)"><rect width="140" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="entity-title" x="70" y="36">PASSENGER</text></g>
        <g transform="translate(60, 360)"><rect width="140" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="entity-title" x="70" y="36">DRIVER</text></g>

        <g transform="translate(320, 75)"><rect width="240" height="50" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="0" y1="18" x2="240" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="120" y="14">4.1</text><text class="process-title" x="120" y="36">Receive &amp; Calculate Tariff</text></g>
        <g transform="translate(320, 165)"><rect width="240" height="50" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="0" y1="18" x2="240" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="120" y="14">4.2</text><text class="process-title" x="120" y="36">Match Front-of-Queue (#1) Driver</text></g>
        <g transform="translate(320, 255)"><rect width="240" height="50" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="0" y1="18" x2="240" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="120" y="14">4.3</text><text class="process-title" x="120" y="36">Handle Dispatch Timeout</text></g>
        
        <g transform="translate(320, 345)"><rect width="240" height="60" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/><line x1="0" y1="18" x2="240" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="120" y="14">4.4</text><text class="node-title" x="120" y="36" text-anchor="middle">Priority Queue Recovery Engine</text><text class="flow-text-center" x="120" y="50">(Auto-reinstates victim driver to #1 slot)</text></g>
        
        <g transform="translate(320, 445)"><rect width="240" height="50" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="0" y1="18" x2="240" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="120" y="14">4.5</text><text class="process-title" x="120" y="36">Stream Telemetry &amp; In-App Chat</text></g>
        <g transform="translate(320, 535)"><rect width="240" height="50" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="0" y1="18" x2="240" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="120" y="14">4.6</text><text class="process-title" x="120" y="36">Finalize Trip &amp; Remittance</text></g>

        <!-- Datastores (3-sided open right) -->
        <g transform="translate(680, 80)">
            <path d="M 200 0 L 0 0 L 0 45 L 200 45" fill="none" stroke="#000000" stroke-width="1.2"/>
            <line x1="40" y1="0" x2="40" y2="45" stroke="#000000" stroke-width="1.2"/>
            <text class="store-id" x="20" y="27">D3</text><text class="store-name" x="50" y="27">rides_3nf</text>
        </g>
        <g transform="translate(680, 350)">
            <path d="M 200 0 L 0 0 L 0 45 L 200 45" fill="none" stroke="#000000" stroke-width="1.2"/>
            <line x1="40" y1="0" x2="40" y2="45" stroke="#000000" stroke-width="1.2"/>
            <text class="store-id" x="20" y="27">D2</text><text class="store-name" x="50" y="27">drivers_3nf (Queue)</text>
        </g>

        <!-- 90-degree lines -->
        <path d="M 200 135 L 260 135 L 260 100 L 320 100" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <text class="flow-text" x="210" y="130">Ride Request</text>

        <path d="M 440 125 L 440 165" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 440 215 L 440 255" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 440 305 L 440 345" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Recovery -> D2 (Right straight) -->
        <path d="M 560 375 L 680 375" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text class="flow-text" x="570" y="370">Restore #1 Slot</text>

        <!-- Recovery -> Driver (Left straight) -->
        <path d="M 320 375 L 200 375" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text class="flow-text" x="210" y="370">Priority Restored</text>

        <path d="M 440 405 L 440 445" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 440 495 L 440 535" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- 4.1 -> D3 -->
        <path d="M 560 100 L 680 100" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- 4.6 -> D3 (Right, Up, Right) -->
        <path d="M 560 560 L 640 560 L 640 115 L 680 115" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    
</svg>