<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="1120" height="660" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 8. Context Diagram of SRH LINK-TODA System</text>
    </g>

    
    <!-- Top-Left Entity: PASSENGER -->
    <g transform="translate(80, 80)">
        <rect width="180" height="70" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <text class="entity-title" x="90" y="32">PASSENGER /</text>
        <text class="entity-title" x="90" y="48">COMMUTER</text>
    </g>

    <!-- Top-Right Entity: DRIVER -->
    <g transform="translate(860, 80)">
        <rect width="180" height="70" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <text class="entity-title" x="90" y="32">TRICYCLE DRIVER /</text>
        <text class="entity-title" x="90" y="48">OPERATOR</text>
    </g>

    <!-- Bottom-Left Entity: SUPERADMIN -->
    <g transform="translate(80, 500)">
        <rect width="180" height="70" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <text class="entity-title" x="90" y="32">SUPERADMIN /</text>
        <text class="entity-title" x="90" y="48">MUNICIPAL LGU</text>
    </g>

    <!-- Bottom-Right Entity: TODA ADMIN -->
    <g transform="translate(860, 500)">
        <rect width="180" height="70" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <text class="entity-title" x="90" y="32">TODA OFFICIAL /</text>
        <text class="entity-title" x="90" y="48">DISPATCHER</text>
    </g>

    <!-- Central Process Box (Process 0) -->
    <g transform="translate(450, 260)">
        <rect width="220" height="110" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
        <line x1="0" y1="24" x2="220" y2="24" stroke="#000000" stroke-width="1"/>
        <text class="process-num" x="110" y="17">0</text>
        <text class="header-text" x="110" y="65" font-size="14">SRH LINK-TODA</text>
    </g>

    <!-- TOP-LEFT (Passenger -> P0) -->
    <path d="M 260 95 L 480 95 L 480 260" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="270" y="90">Ride Request &amp; Pickup/Drop GPS</text>

    <path d="M 260 115 L 510 115 L 510 260" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="270" y="110">Account &amp; OTP Registration</text>

    <path d="M 460 260 L 460 135 L 260 135" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="270" y="130">Live Queue Status &amp; Driver GPS</text>

    <path d="M 440 260 L 440 150 L 260 150" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="270" y="145">Metered Fare Receipt</text>

    <!-- TOP-RIGHT (Driver -> P0) -->
    <path d="M 860 95 L 640 95 L 640 260" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text-right" x="850" y="90">35m Geofence GPS Coordinates</text>

    <path d="M 860 115 L 610 115 L 610 260" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text-right" x="850" y="110">MTOP &amp; License Credentials</text>

    <path d="M 660 260 L 660 135 L 860 135" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text-right" x="850" y="130">FIFO Queue Rank (#1 Slot)</text>

    <path d="M 680 260 L 680 150 L 860 150" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text-right" x="850" y="145">Dispatch Alert &amp; Priority Recovery</text>

    <!-- BOTTOM-LEFT (Superadmin -> P0) -->
    <path d="M 260 515 L 480 515 L 480 370" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="270" y="510">Municipal Tariff Calibration</text>

    <path d="M 460 370 L 460 540 L 260 540" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="270" y="535">Immutable System Activity Logs</text>

    <!-- BOTTOM-RIGHT (TODA Admin -> P0) -->
    <path d="M 860 515 L 640 515 L 640 370" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text-right" x="850" y="510">Manual Queue Overrides</text>

    <path d="M 660 370 L 660 540 L 860 540" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text-right" x="850" y="535">Live Terminal Queue &amp; Remittance</text>
    
</svg>