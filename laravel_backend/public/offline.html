<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>No Internet Connection - SRH LINK-TODA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0f172a; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; text-align: center; }
        .card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(16px); border-radius: 2rem; padding: 2.5rem 1.5rem; width: 100%; max-width: 24rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .badge { display: inline-flex; align-items: center; justify-content: center; background: #881337; color: #ffffff; font-size: 0.75rem; font-weight: 800; padding: 0.35rem 1rem; border-radius: 9999px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1.25rem; border: 1px solid rgba(255,255,255,0.2); }
        h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 0.5rem; tracking-tight; color: #ffffff; }
        p { font-size: 0.875rem; color: #94a3b8; font-weight: 600; line-height: 1.5; margin-bottom: 1.75rem; }
        .btn { display: inline-flex; items-center: center; justify-content: center; width: 100%; padding: 1rem; background: #2563eb; color: #ffffff; font-weight: 900; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 1rem; border: none; cursor: pointer; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); transition: transform 0.15s ease, background 0.15s ease; }
        .btn:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Offline Mode</div>
        <h1>No Internet Connection</h1>
        <p>SRH LINK-TODA requires an active Wi-Fi or mobile data connection to access live queue data and rides.</p>
        <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>

    <script>
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
