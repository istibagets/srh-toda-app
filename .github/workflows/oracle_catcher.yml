name: Oracle Always Free Catcher

on:
  workflow_dispatch:
  schedule:
    # Backup trigger every 4 hours in case a run ever stops
    - cron: '0 */4 * * *'

permissions:
  actions: write
  contents: read

jobs:
  hunt_slot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OCI Dependencies
        run: |
          npm install oci-sdk oci-common oci-core

      - name: Setup OCI Authentication
        run: |
          mkdir -p ~/.oci
          cat << 'EOF' > ~/.oci/config
          ${{ secrets.OCI_CONFIG }}
          EOF
          cat << 'EOF' > ~/.oci/oci_api_key.pem
          ${{ secrets.OCI_KEY }}
          EOF
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Run Slot Catcher (Continuous Loop)
        id: catcher
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          node .github/scripts/oracle_catcher.js

      - name: Chain Next Shift Automatically (Runs Forever Until Found)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Shift finished without a slot. Automatically chaining the next shift right now..."
          gh workflow run oracle_catcher.yml --ref main
