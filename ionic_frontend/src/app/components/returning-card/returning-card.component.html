<div class="returning-card-wrapper">
  <div class="returning-card-inner">
    <div class="card-header-col">
      <span class="eyebrow-text">HEADING BACK TO TODA TERMINAL</span>
      <h2 class="main-title">Auto-Joining Queue On Arrival</h2>
    </div>

    <button
      type="button"
      id="btn-add-wayside-passenger"
      class="btn-add-wayside"
      (click)="onAddWayside()"
    >
      <svg class="person-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
      <span class="btn-plus">+</span>
      <span class="btn-label">ADD WAYSIDE PASSENGER</span>
    </button>
  </div>
</div>
