<div class="dropoff-content-wrapper">
  <!-- Trip Destination Overview -->
  <div class="destination-overview-row">
    <div class="dest-pin-col">
      <span class="dest-indicator-dot"></span>
    </div>
    <div class="dest-text-col">
      <div class="dest-label-line">
        <span class="dest-eyebrow">DROP-OFF LOCATION</span>
        @if (driverService.activeTrip()?.fare) {
          <span class="fare-pill">₱{{ driverService.activeTrip()?.fare | number:'1.2-2' }}</span>
        }
      </div>
      <h2 class="dest-title">
        {{ driverService.activeTrip()?.dropoffLocation || 'Destination' }}
      </h2>
      <div class="trip-meta-line">
        <span class="meta-item">
          <svg class="meta-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          {{ driverService.activeTrip()?.passengerCount || 1 }} Pax
        </span>
        <span class="meta-dot">•</span>
        <span class="meta-item">Terminal Walk-In</span>
      </div>
    </div>
  </div>

  <!-- Primary Drop Off Action Button -->
  <button
    type="button"
    id="primary-dropoff-btn"
    class="primary-dropoff-btn"
    (click)="onDropOff()"
  >
    <div class="btn-inner">
      <svg class="dropoff-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span>Drop Off Passenger</span>
    </div>
  </button>
</div>
