<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 690" width="1140" height="690">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="1140" height="690" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 3. Empirical Data Gathering and System Evaluation Flowchart (ISO 25010)</text>
    </g>

    
        <g transform="translate(240, 80)">
            <rect width="660" height="75" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <line x1="0" y1="24" x2="660" y2="24" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="15" y="17">STAGE 1: System Development &amp; Lab Validation</text>
            <text class="node-desc" x="15" y="48">Implementation of Laravel 11 API, 35m Haversine algorithm, and Reverb WebSocket telemetry under lab test cases.</text>
        </g>
            <path d="M 570 155 L 570 195" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <g transform="translate(240, 195)">
            <rect width="660" height="75" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <line x1="0" y1="24" x2="660" y2="24" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="15" y="17">STAGE 2: Participant Orientation &amp; Training</text>
            <text class="node-desc" x="15" y="48">Onboarding session with SRH TODA drivers, commuters, and dispatchers demonstrating PWA operation and 35m check-in.</text>
        </g>
            <path d="M 570 270 L 570 310" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <g transform="translate(240, 310)">
            <rect width="660" height="75" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <line x1="0" y1="24" x2="660" y2="24" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="15" y="17">STAGE 3: Field Pilot Testing &amp; Live Observation</text>
            <text class="node-desc" x="15" y="48">14-day operational field pilot at Santa Rosa Aliaga Road terminal executing real-time dispatches and queue rotations.</text>
        </g>
            <path d="M 570 385 L 570 425" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <g transform="translate(240, 425)">
            <rect width="660" height="75" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <line x1="0" y1="24" x2="660" y2="24" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="15" y="17">STAGE 4: Survey Administration (ISO/IEC 25010:2023)</text>
            <text class="node-desc" x="15" y="48">Administering standardized Likert-scale questionnaires across Commuters (n=100), Drivers (n=30), and IT Experts (n=5).</text>
        </g>
            <path d="M 570 500 L 570 540" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <g transform="translate(240, 540)">
            <rect width="660" height="75" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <line x1="0" y1="24" x2="660" y2="24" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="15" y="17">STAGE 5: Data Collation &amp; Statistical Analysis</text>
            <text class="node-desc" x="15" y="48">Computing composite Mean, Standard Deviation, and Likert verbal interpretations validating software quality criteria.</text>
        </g>
</svg>