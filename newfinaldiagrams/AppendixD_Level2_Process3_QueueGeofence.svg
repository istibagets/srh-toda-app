<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="960" height="460" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 12. Level 2 Data Flow Diagram of Process 3.0 – Terminal 35m Geofence &amp; Queue</text>
    </g>

    
        <g transform="translate(60, 110)"><rect width="140" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text class="entity-title" x="70" y="36">DRIVER</text></g>
        <g transform="translate(320, 80)"><rect width="250" height="50" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="0" y1="18" x2="250" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="125" y="14">3.1</text><text class="process-title" x="125" y="36">Poll HTML5 GPS Telemetry</text></g>
        <g transform="translate(320, 170)"><rect width="250" height="50" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="0" y1="18" x2="250" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="125" y="14">3.2</text><text class="process-title" x="125" y="36">Compute Haversine (d &#8804; 35m)</text></g>
        <g transform="translate(320, 260)"><rect width="250" height="50" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="0" y1="18" x2="250" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="125" y="14">3.3</text><text class="process-title" x="125" y="36">Verify Duty &amp; MTOP Status</text></g>
        <g transform="translate(320, 350)"><rect width="250" height="50" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="0" y1="18" x2="250" y2="18" stroke="#000000" stroke-width="1"/><text class="process-num" x="125" y="14">3.4</text><text class="process-title" x="125" y="36">Assign Tail-of-Queue FIFO Slot</text></g>
        <g transform="translate(690, 350)">
            <path d="M 200 0 L 0 0 L 0 45 L 200 45" fill="none" stroke="#000000" stroke-width="1.2"/>
            <line x1="40" y1="0" x2="40" y2="45" stroke="#000000" stroke-width="1.2"/>
            <text class="store-id" x="20" y="27">D2</text><text class="store-name" x="50" y="27">drivers_3nf (Queue)</text>
        </g>
        <path d="M 200 130 L 260 130 L 260 105 L 320 105" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 445 130 L 445 170" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 445 220 L 445 260" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 445 310 L 445 350" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 570 375 L 690 375" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 320 375 L 130 375 L 130 170" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    
</svg>