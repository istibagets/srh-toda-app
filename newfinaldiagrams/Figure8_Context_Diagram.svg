<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" width="1140" height="660">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="1140" height="660" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 8. Context Diagram of SRH LINK-TODA System</text>
    </g>

    
    <!-- Top-Left Entity: PASSENGER (X=80..280, Y=70..150) -->
    <g transform="translate(80, 70)">
        <rect width="200" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <text class="entity-title" x="100" y="36">PASSENGER /</text>
        <text class="entity-title" x="100" y="54">COMMUTER</text>
    </g>

    <!-- Top-Right Entity: DRIVER (X=840..1040, Y=70..150) -->
    <g transform="translate(840, 70)">
        <rect width="200" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <text class="entity-title" x="100" y="36">TRICYCLE DRIVER /</text>
        <text class="entity-title" x="100" y="54">OPERATOR</text>
    </g>

    <!-- Bottom-Left Entity: SUPERADMIN (X=80..280, Y=490..570) -->
    <g transform="translate(80, 490)">
        <rect width="200" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <text class="entity-title" x="100" y="36">SUPERADMIN /</text>
        <text class="entity-title" x="100" y="54">MUNICIPAL LGU</text>
    </g>

    <!-- Bottom-Right Entity: TODA DISPATCHER (X=840..1040, Y=490..570) -->
    <g transform="translate(840, 490)">
        <rect width="200" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
        <text class="entity-title" x="100" y="36">TODA OFFICIAL /</text>
        <text class="entity-title" x="100" y="54">DISPATCHER</text>
    </g>

    <!-- Central Process Box (Process 0: X=440..680, Y=260..380) -->
    <g transform="translate(440, 260)">
        <rect width="240" height="120" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
        <line x1="0" y1="26" x2="240" y2="26" stroke="#000000" stroke-width="1"/>
        <text class="process-num" x="120" y="18">0</text>
        <text class="header-text" x="120" y="72" font-size="14">SRH LINK-TODA</text>
    </g>

    <!-- TOP-LEFT LINES (Passenger <-> Process 0) -->
    <path d="M 280 90 L 480 90 L 480 260" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="290" y="85">Ride Request &amp; Pickup/Drop GPS</text>

    <path d="M 280 110 L 510 110 L 510 260" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="290" y="105">Account &amp; OTP Registration</text>

    <path d="M 460 260 L 460 130 L 280 130" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="290" y="125">Live Queue Status &amp; Driver GPS</text>

    <path d="M 440 260 L 440 145 L 280 145" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="290" y="140">Metered Fare Receipt</text>

    <!-- TOP-RIGHT LINES (Driver <-> Process 0) -->
    <path d="M 840 90 L 640 90 L 640 260" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text-right" x="830" y="85">35m Geofence GPS Coordinates</text>

    <path d="M 840 110 L 610 110 L 610 260" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text-right" x="830" y="105">MTOP &amp; License Credentials</text>

    <path d="M 660 260 L 660 130 L 840 130" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text-right" x="830" y="125">FIFO Queue Rank (#1 Slot)</text>

    <path d="M 680 260 L 680 145 L 840 145" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text-right" x="830" y="140">Dispatch Alert &amp; Priority Recovery</text>

    <!-- BOTTOM-LEFT LINES (Superadmin <-> Process 0) -->
    <path d="M 280 510 L 480 510 L 480 380" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="290" y="505">Municipal Tariff Calibration</text>

    <path d="M 280 530 L 510 530 L 510 380" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="290" y="525">35m Terminal Anchor Setup</text>

    <path d="M 460 380 L 460 550 L 280 550" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="290" y="545">Immutable System Activity Logs</text>

    <!-- BOTTOM-RIGHT LINES (Dispatcher <-> Process 0) -->
    <path d="M 840 510 L 640 510 L 640 380" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text-right" x="830" y="505">Manual Queue Overrides</text>

    <path d="M 840 530 L 610 530 L 610 380" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text-right" x="830" y="525">Accreditation Approvals</text>

    <path d="M 660 380 L 660 550 L 840 550" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text-right" x="830" y="545">Live Terminal Queue Monitor</text>
    
</svg>