<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="960" height="580" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 2. Map of Santa Rosa Homes Research Locale &amp; 35m Geofence</text>
    </g>

    
    <!-- Outer Border -->
    <rect x="50" y="60" width="860" height="480" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>

    <!-- Map Header -->
    <text class="header-text" x="480" y="90" font-size="13">SRH TRICYCLE TERMINAL OPERATIONAL BOUNDARY &amp; GEOFENCE CALIBRATION</text>
    <text class="flow-text-center" x="480" y="110">Santa Rosa, Nueva Ecija, Philippines (Latitude: 15.4247°N, Longitude: 120.9416°E)</text>

    <!-- Main Highway -->
    <rect x="80" y="270" width="800" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <line x1="80" y1="290" x2="880" y2="290" stroke="#000000" stroke-width="1" stroke-dasharray="8,6"/>
    <text class="node-title" x="180" y="285">Santa Rosa – Aliaga Road</text>
    <text class="node-title" x="720" y="285">To Maharlika Highway &#8594;</text>

    <!-- Cross Street -->
    <rect x="440" y="130" width="80" height="360" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <line x1="480" y1="130" x2="480" y2="490" stroke="#000000" stroke-width="1" stroke-dasharray="8,6"/>
    <text class="node-title" x="480" y="150" text-anchor="middle">Terminal Access Road</text>

    <!-- 35-Meter Geofence Circle -->
    <circle cx="480" cy="290" r="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4"/>
    
    <!-- Radius Line -->
    <line x1="480" y1="290" x2="590" y2="290" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text class="node-title" x="535" y="282">R = 35.0 m</text>

    <!-- Terminal Anchor Point -->
    <circle cx="480" cy="290" r="10" fill="#000000" stroke="#000000" stroke-width="1.5"/>
    <text class="node-title" x="480" y="325" text-anchor="middle">Terminal Anchor GPS</text>
    <text class="flow-text-center" x="480" y="340">(15.4247°N, 120.9416°E)</text>

    <!-- Driver inside geofence -->
    <circle cx="430" cy="250" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text class="flow-text" x="340" y="245">Driver #1 (Inside &#8804; 35m)</text>

    <circle cx="520" cy="330" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text class="flow-text" x="530" y="335">Driver #2 (Inside &#8804; 35m)</text>

    <!-- Driver outside geofence -->
    <circle cx="680" cy="275" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text class="flow-text" x="650" y="265">Driver #3 (Outside &gt; 35m / Off-Duty)</text>

    <!-- Legend Box -->
    <g transform="translate(80, 360)">
        <rect width="250" height="130" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="table-head" x="125" y="20" text-anchor="middle">GEOFENCE SPECIFICATIONS</text>
        <line x1="10" y1="28" x2="240" y2="28" stroke="#000000" stroke-width="1"/>
        <text class="node-desc" x="15" y="48">• Operational Radius: 35.0 Meters</text>
        <text class="node-desc" x="15" y="68">• Haversine Spherical Distance Formula</text>
        <text class="node-desc" x="15" y="88">• HTML5 High-Accuracy GPS Telemetry</text>
        <text class="node-desc" x="15" y="108">• Real-time Automatic Queue Inclusion</text>
    </g>
    
</svg>