<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="880" height="600" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 17. Second Normal Form (2NF) of the SRH LINK-TODA Database Structure</text>
    </g>

    
        <g transform="translate(50, 70)">
            <rect width="220" height="140" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="220" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="110" y="14" text-anchor="middle">users_2nf</text>
            <text class="node-title" x="8" y="34">PK: user_id</text>
            <text class="node-desc" x="8" y="48">full_name</text><text class="node-desc" x="8" y="62">email</text><text class="node-desc" x="8" y="76">phone</text><text class="node-desc" x="8" y="90">role_id</text><text class="node-desc" x="8" y="104">role_name</text><text class="node-desc" x="8" y="118">account_status</text>
        </g>
        <g transform="translate(300, 70)">
            <rect width="250" height="155" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="250" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="125" y="14" text-anchor="middle">drivers_2nf</text>
            <text class="node-title" x="8" y="34">PK: driver_id</text>
            <text class="node-desc" x="8" y="48">user_id</text><text class="node-desc" x="8" y="62">mtop_number</text><text class="node-desc" x="8" y="76">plate_number</text><text class="node-desc" x="8" y="90">license_number</text><text class="node-desc" x="8" y="104">body_number</text><text class="node-desc" x="8" y="118">queue_rank</text><text class="node-desc" x="8" y="132">geofence_status</text>
        </g>
        <g transform="translate(580, 70)">
            <rect width="250" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="250" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="125" y="14" text-anchor="middle">terminals_2nf</text>
            <text class="node-title" x="8" y="34">PK: terminal_id</text>
            <text class="node-desc" x="8" y="48">terminal_name</text><text class="node-desc" x="8" y="62">anchor_latitude</text><text class="node-desc" x="8" y="76">anchor_longitude</text><text class="node-desc" x="8" y="90">geofence_radius</text>
        </g>
        <g transform="translate(580, 200)">
            <rect width="250" height="95" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="250" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="125" y="14" text-anchor="middle">tariffs_2nf</text>
            <text class="node-title" x="8" y="34">PK: tariff_id</text>
            <text class="node-desc" x="8" y="48">base_fare</text><text class="node-desc" x="8" y="62">per_km_rate</text><text class="node-desc" x="8" y="76">night_differential</text>
        </g>
        <g transform="translate(50, 240)">
            <rect width="220" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="220" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="110" y="14" text-anchor="middle">rides_2nf</text>
            <text class="node-title" x="8" y="34">PK: ride_id</text>
            <text class="node-desc" x="8" y="48">passenger_id</text><text class="node-desc" x="8" y="62">driver_id</text><text class="node-desc" x="8" y="76">terminal_id</text><text class="node-desc" x="8" y="90">tariff_id</text><text class="node-desc" x="8" y="104">pickup_lat</text><text class="node-desc" x="8" y="118">drop_lat</text><text class="node-desc" x="8" y="132">distance_km</text><text class="node-desc" x="8" y="146">total_fare</text><text class="node-desc" x="8" y="160">ride_status</text>
        </g>
        <g transform="translate(300, 250)">
            <rect width="250" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="250" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="125" y="14" text-anchor="middle">messages_2nf</text>
            <text class="node-title" x="8" y="34">PK: message_id</text>
            <text class="node-desc" x="8" y="48">ride_id</text><text class="node-desc" x="8" y="62">sender_id</text><text class="node-desc" x="8" y="76">receiver_id</text><text class="node-desc" x="8" y="90">message_content</text><text class="node-desc" x="8" y="104">sent_at</text>
        </g>
        <g transform="translate(580, 315)">
            <rect width="250" height="135" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="250" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="125" y="14" text-anchor="middle">reports_2nf</text>
            <text class="node-title" x="8" y="34">PK: report_id</text>
            <text class="node-desc" x="8" y="48">ride_id</text><text class="node-desc" x="8" y="62">reporter_id</text><text class="node-desc" x="8" y="76">category</text><text class="node-desc" x="8" y="90">description</text><text class="node-desc" x="8" y="104">status</text><text class="node-desc" x="8" y="118">resolution</text>
        </g>
        <g transform="translate(50, 445)">
            <rect width="220" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="220" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="110" y="14" text-anchor="middle">remittances_2nf</text>
            <text class="node-title" x="8" y="34">PK: remittance_id</text>
            <text class="node-desc" x="8" y="48">driver_id</text><text class="node-desc" x="8" y="62">collector_id</text><text class="node-desc" x="8" y="76">amount</text><text class="node-desc" x="8" y="90">receipt_number</text><text class="node-desc" x="8" y="104">payment_date</text>
        </g>
        <g transform="translate(300, 400)">
            <rect width="250" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="250" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="125" y="14" text-anchor="middle">activity_logs_2nf</text>
            <text class="node-title" x="8" y="34">PK: log_id</text>
            <text class="node-desc" x="8" y="48">actor_id</text><text class="node-desc" x="8" y="62">action_type</text><text class="node-desc" x="8" y="76">ip_address</text><text class="node-desc" x="8" y="90">timestamp</text>
        </g>
</svg>