<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="960" height="540" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 16. First Normal Form (1NF) of the SRH LINK-TODA Database Structure</text>
    </g>

    
    <!-- 1NF Master Table Box -->
    <rect x="50" y="60" width="860" height="260" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>

    <rect x="50" y="60" width="860" height="25" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="table-head" x="480" y="78" text-anchor="middle">srh_toda_1nf (First Normal Form)</text>

    <text class="node-title" x="65" y="105">Composite Primary Key: [ user_id + driver_id + ride_id + message_id + report_id + remittance_id + log_id ]</text>
    <line x1="65" y1="112" x2="895" y2="112" stroke="#000000" stroke-width="1"/>

    <g transform="translate(65, 130)">
        <text class="node-desc" x="0" y="0"><tspan font-weight="bold">user_id (PK)</tspan>, full_name, email, phone, user_role, role_id, role_name, account_status</text>
        <text class="node-desc" x="0" y="20"><tspan font-weight="bold">driver_id (PK)</tspan>, mtop_number, plate_number, license_number, body_number, queue_rank, geofence_status</text>
        <text class="node-desc" x="0" y="40">terminal_id, terminal_name, terminal_lat, terminal_lng, geofence_radius_meters</text>
        <text class="node-desc" x="0" y="60">tariff_id, base_fare, per_km_rate, night_differential_multiplier</text>
        <text class="node-desc" x="0" y="80"><tspan font-weight="bold">ride_id (PK)</tspan>, passenger_id, pickup_lat, pickup_lng, drop_lat, drop_lng, distance_km, total_fare, ride_status</text>
        <text class="node-desc" x="0" y="100"><tspan font-weight="bold">message_id (PK)</tspan>, sender_id, receiver_id, message_content, sent_at</text>
        <text class="node-desc" x="0" y="120"><tspan font-weight="bold">report_id (PK)</tspan>, reported_user_id, report_category, incident_description, report_status, resolution_notes</text>
        <text class="node-desc" x="0" y="140"><tspan font-weight="bold">remittance_id (PK)</tspan>, collector_id, daily_dues_amount, receipt_number, payment_date</text>
        <text class="node-desc" x="0" y="160"><tspan font-weight="bold">log_id (PK)</tspan>, actor_id, action_type, ip_address, log_timestamp</text>
    </g>

    <!-- Dependency Analysis Section -->
    <text class="table-head" x="50" y="350">FUNCTIONAL &amp; PARTIAL DEPENDENCY ANALYSIS (Eliminated in 2NF / 3NF)</text>

    <!-- Dependency Boxes -->
    <g transform="translate(50, 365)">
        <rect width="410" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="node-title" x="10" y="16">Partial Dependency 1:</text>
        <text class="node-desc" x="10" y="28">user_id &#8594; { full_name, email, phone, user_role, status }</text>
    </g>

    <g transform="translate(500, 365)">
        <rect width="410" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="node-title" x="10" y="16">Partial Dependency 2:</text>
        <text class="node-desc" x="10" y="28">driver_id &#8594; { mtop_num, plate_num, body_num, queue_rank }</text>
    </g>

    <g transform="translate(50, 415)">
        <rect width="410" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="node-title" x="10" y="16">Partial Dependency 3:</text>
        <text class="node-desc" x="10" y="28">ride_id &#8594; { pickup_lat, drop_lat, distance_km, total_fare }</text>
    </g>

    <g transform="translate(500, 415)">
        <rect width="410" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="node-title" x="10" y="16">Partial Dependency 4:</text>
        <text class="node-desc" x="10" y="28">message_id &#8594; { sender_id, receiver_id, message_content }</text>
    </g>

    <g transform="translate(50, 465)">
        <rect width="410" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="node-title" x="10" y="16">Transitive Dependency 1:</text>
        <text class="node-desc" x="10" y="28">role_id &#8594; role_name</text>
    </g>

    <g transform="translate(500, 465)">
        <rect width="410" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="node-title" x="10" y="16">Transitive Dependency 2:</text>
        <text class="node-desc" x="10" y="28">terminal_id &#8594; { terminal_name, anchor_coords, radius }</text>
    </g>
    
</svg>