            <text class="store-id" x="20" y="27">D6</text>
            <text class="store-name" x="50" y="27">Remittance &amp; Audit Logs</text>
        </g>

        <!-- Process -> Datastore connector (Straight 90-degree horizontal line) -->
        <path d="M 740 657 L 880 657" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
        
    <!-- E1 -> P1.0 -->
    <path d="M 200 105 L 460 105" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
