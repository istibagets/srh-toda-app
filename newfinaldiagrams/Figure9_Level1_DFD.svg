    <path d="M 200 480 L 250 480 L 250 645 L 460 645" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="210" y="475">Remittance Audit</text>

    <!-- E4 -> P4.0 -->
    <path d="M 200 625 L 400 625 L 400 450 L 460 450" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="210" y="620">Tariff Multiplier</text>

    <!-- E4 -> P6.0 -->
    <path d="M 200 660 L 460 660" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="flow-text" x="210" y="655">Activity Logs</text>
    
</svg>