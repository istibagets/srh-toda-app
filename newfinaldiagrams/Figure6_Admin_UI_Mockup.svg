    <text class="table-head" x="95" y="192">14 Tricycles</text>

    <rect x="280" y="145" width="190" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="node-desc" x="295" y="168">Completed Dispatches</text>
    <text class="table-head" x="295" y="192">184 Trips Today</text>

    <rect x="480" y="145" width="190" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="node-desc" x="495" y="168">Daily Remittance Ledger</text>
    <text class="table-head" x="495" y="192">PHP 3,680.00</text>

    <rect x="680" y="145" width="200" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="node-desc" x="695" y="168">Incident Blotters</text>
    <text class="table-head" x="695" y="192">0 Pending Disputes</text>

    <!-- Table: Live Queue Monitor -->
    <rect x="80" y="215" width="480" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="table-head" x="95" y="238">LIVE FIFO QUEUE MONITOR &amp; OVERRIDE</text>
    <line x1="80" y1="248" x2="560" y2="248" stroke="#000000" stroke-width="1"/>
    <text class="node-title" x="95" y="270">Rank 1: Body #042 (Juan Dela Cruz) &#8226; 35m GPS: In-Bounds &#8226; Status: STANDBY</text>
    <text class="node-title" x="95" y="295">Rank 2: Body #108 (Pedro Santos) &#8226; 35m GPS: In-Bounds &#8226; Status: STANDBY</text>
    <text class="node-title" x="95" y="320">Rank 3: Body #015 (Carlos Reyes) &#8226; 35m GPS: En Route &#8226; Status: DISPATCHED</text>
    <text class="node-desc" x="95" y="345">Rank 4: Body #088 (Mario Bautista) &#8226; 35m GPS: In-Bounds &#8226; Status: STANDBY</text>
    <text class="flow-text" x="95" y="375">[ Reorder Queue ]   [ Manual Insert ]   [ Remove Off-Duty ]   [ Export CSV ]</text>

    <!-- Table: Tariff Settings -->
