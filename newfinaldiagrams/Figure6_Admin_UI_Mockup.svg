    <line x1="570" y1="248" x2="880" y2="248" stroke="#000000" stroke-width="1"/>
    <text class="node-desc" x="585" y="270">Base Fare (First 1.0 km): <tspan font-weight="bold">PHP 20.00</tspan></text>
    <text class="node-desc" x="585" y="295">Distance Multiplier (Per km): <tspan font-weight="bold">PHP 10.00</tspan></text>
    <text class="node-desc" x="585" y="320">Geofence Radius: <tspan font-weight="bold">35.0 Meters</tspan></text>
    <text class="node-desc" x="585" y="345">Dispatch Timeout: <tspan font-weight="bold">15 Seconds</tspan></text>
    <text class="flow-text" x="585" y="375">[ Calibrate Tariff Multiplier ]   [ Save Settings ]</text>

    <!-- Footer System Status -->
    <rect x="80" y="415" width="800" height="35" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="flow-text-center" x="480" y="437">Immutable Audit Trail &#8226; Laravel Reverb Socket: CONNECTED (Port 8080) &#8226; MariaDB 10.11 Synced &#8226; SHA-256 Verified</text>
    
</svg>