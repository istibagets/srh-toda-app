<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <defs>
    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="dashArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Problem Box -->
  <g id="problem-box">
    <rect x="50" y="40" width="330" height="200" rx="14" ry="14" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>
    <text x="215" y="70" text-anchor="middle" font-size="16" font-weight="bold">Problem:</text>
    <text x="215" y="90" text-anchor="middle" font-size="14" font-weight="bold">CURRENT DISPATCHING LIMITATIONS</text>
    <line x1="65" y1="102" x2="365" y2="102" stroke="#333333" stroke-width="1"/>
    <text x="75" y="128" font-size="13.5">• Manual communications (keypad phone)</text>
    <text x="75" y="152" font-size="13.5">• High commuter waiting anxiety</text>
    <text x="75" y="176" font-size="13.5">• Information asymmetry (no queue visibility)</text>
    <text x="75" y="200" font-size="13.5">• Manual and fragmented records</text>
  </g>

  <!-- Input Box -->
  <g id="input-box">
    <rect x="720" y="40" width="330" height="200" rx="14" ry="14" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>
    <text x="885" y="70" text-anchor="middle" font-size="16" font-weight="bold">Input:</text>
    <text x="885" y="90" text-anchor="middle" font-size="14" font-weight="bold">PROPOSED SRH LINK-TODA SYSTEM</text>
    <line x1="735" y1="102" x2="1035" y2="102" stroke="#333333" stroke-width="1"/>
    <text x="745" y="125" font-size="13.5">• Progressive Web App (PWA)</text>
    <text x="745" y="148" font-size="13.5">• HTML5 Geolocation integration</text>
    <text x="745" y="171" font-size="13.5" font-weight="bold" fill="#000000">• 35m Terminal Geofencing</text>
    <text x="745" y="194" font-size="13.5">• Priority-Based Queue Algorithm</text>
    <text x="745" y="217" font-size="13.5">• Super Admin transparency dashboard</text>
  </g>

  <!-- Center Process Core -->
  <g id="process-core">
    <!-- Center Label -->
    <text x="550" y="345" text-anchor="middle" font-size="18" font-weight="bold" letter-spacing="1">PROCESS</text>

    <!-- Node 1: Requirement Analysis -->
    <rect x="480" y="180" width="140" height="52" rx="20" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="550" y="202" text-anchor="middle" font-size="12.5" font-weight="bold">Requirement</text>
    <text x="550" y="218" text-anchor="middle" font-size="12.5" font-weight="bold">Analysis</text>

    <!-- Node 2: Design -->
    <rect x="615" y="260" width="115" height="48" rx="20" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="672" y="290" text-anchor="middle" font-size="13" font-weight="bold">Design</text>

    <!-- Node 3: Implementation -->
    <rect x="615" y="375" width="125" height="48" rx="20" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="677" y="405" text-anchor="middle" font-size="13" font-weight="bold">Implementation</text>

    <!-- Node 4: Testing -->
    <rect x="475" y="450" width="150" height="56" rx="20" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="550" y="473" text-anchor="middle" font-size="13" font-weight="bold">Testing</text>
    <text x="550" y="492" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">(ISO 25010 &amp; WCAG)</text>

    <!-- Node 5: Deployment -->
    <rect x="360" y="375" width="120" height="48" rx="20" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="420" y="405" text-anchor="middle" font-size="13" font-weight="bold">Deployment</text>

    <!-- Node 6: Maintenance -->
    <rect x="360" y="260" width="120" height="48" rx="20" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="420" y="290" text-anchor="middle" font-size="13" font-weight="bold">Maintenance</text>

    <!-- Circular Connecting Arrows -->
    <path d="M 605 225 Q 640 235 650 255" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M 680 312 Q 685 340 680 370" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M 645 427 Q 615 450 595 452" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M 495 452 Q 460 440 445 427" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M 420 370 Q 415 340 420 312" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M 445 255 Q 475 230 495 225" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>

  <!-- Big Feed-In Arrows -->
  <!-- From Problem to Process -->
  <path d="M 380 140 L 490 140 L 490 170 L 515 170 L 475 200 L 435 170 L 460 170 L 460 160 L 380 160 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <!-- From Input to Process -->
  <path d="M 720 140 L 610 140 L 610 170 L 635 170 L 595 200 L 555 170 L 580 170 L 580 160 L 720 160 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>

  <!-- Output Box -->
  <g id="output-box">
    <rect x="50" y="440" width="330" height="195" rx="14" ry="14" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>
    <text x="215" y="470" text-anchor="middle" font-size="16" font-weight="bold">Output:</text>
    <text x="215" y="490" text-anchor="middle" font-size="13" font-weight="bold">FINAL TECHNOLOGICAL PRODUCT</text>
    <line x1="65" y1="502" x2="365" y2="502" stroke="#333333" stroke-width="1"/>
    <text x="215" y="530" text-anchor="middle" font-size="13.5">A Progressive Web Application–Based</text>
    <text x="215" y="552" text-anchor="middle" font-size="13.5">Queue Management System with</text>
    <text x="215" y="574" text-anchor="middle" font-size="13.5">Geolocation, Geofencing, and</text>
    <text x="215" y="596" text-anchor="middle" font-size="13.5">Priority-Based Queue Algorithm</text>
  </g>

  <!-- Process to Output Big Arrow -->
  <path d="M 470 490 L 410 490 L 410 520 L 385 520 L 385 500 L 350 530 L 385 560 L 385 540 L 430 540 L 430 490 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>

  <!-- Impact / Outcome Box -->
  <g id="outcome-box">
    <rect x="720" y="440" width="330" height="195" rx="14" ry="14" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>
    <text x="885" y="470" text-anchor="middle" font-size="16" font-weight="bold">Impact / Outcome:</text>
    <text x="885" y="490" text-anchor="middle" font-size="13.5" font-weight="bold">IMPROVED TRANSPORT LOGISTICS</text>
    <line x1="735" y1="502" x2="1035" y2="502" stroke="#333333" stroke-width="1"/>
    <text x="745" y="525" font-size="13">• Automated terminal queue entry</text>
    <text x="745" y="548" font-size="13">• Real-time &apos;Next-in-Line&apos; tracking</text>
    <text x="745" y="571" font-size="13">• Fair dispatching and driver recovery</text>
    <text x="745" y="594" font-size="13">• Reduced commuter waiting anxiety</text>
    <text x="745" y="617" font-size="13">• Transparent organizational records</text>
  </g>

  <!-- Output to Outcome Direct Arrow -->
  <line x1="380" y1="535" x2="715" y2="535" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Feedback Dashed Loop -->
  <path d="M 1050 535 L 1075 535 L 1075 140 L 1055 140" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#dashArrow)"/>
  <text x="1065" y="340" text-anchor="middle" font-size="13" font-weight="bold" transform="rotate(-90 1065,340)">Feedback</text>
</svg>
