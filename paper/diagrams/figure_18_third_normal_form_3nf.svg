<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" width="880" height="650">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-text { font-size: 10px; font-weight: normal; fill: #000000; }
            .store-text { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; font-family: 'Times New Roman', serif; }
            .table-cell { font-size: 10px; font-weight: normal; fill: #000000; font-family: 'Times New Roman', serif; }
            .table-cell-bold { font-size: 10px; font-weight: bold; fill: #000000; font-family: 'Times New Roman', serif; }
            .flow-text { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; }
            .flow-text-right { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="880" height="650" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 18. Third Normal Form (3NF) of the SRH LINK-TODA Database Structure</text>
    </g>

    
        <g transform="translate(50, 70)">
            <rect width="220" height="95" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="220" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="110" y="14" text-anchor="middle">roles_3nf</text>
            <text class="table-cell-bold" x="8" y="34">PK: role_id</text>
            
            <text class="table-cell" x="8" y="46">role_name</text><text class="table-cell" x="8" y="59">description</text>
        </g>
        <g transform="translate(50, 190)">
            <rect width="220" height="140" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="220" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="110" y="14" text-anchor="middle">users_3nf</text>
            <text class="table-cell-bold" x="8" y="34">PK: user_id</text>
            <text class="flow-text" x="8" y="46">FK: role_id</text>
            <text class="table-cell" x="8" y="59">full_name</text><text class="table-cell" x="8" y="72">email</text><text class="table-cell" x="8" y="85">phone</text><text class="table-cell" x="8" y="98">status</text><text class="table-cell" x="8" y="111">created_at</text>
        </g>
        <g transform="translate(310, 70)">
            <rect width="240" height="160" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">drivers_3nf</text>
            <text class="table-cell-bold" x="8" y="34">PK: driver_id</text>
            <text class="flow-text" x="8" y="46">FK: user_id</text>
            <text class="table-cell" x="8" y="59">mtop_number</text><text class="table-cell" x="8" y="72">plate_number</text><text class="table-cell" x="8" y="85">license_number</text><text class="table-cell" x="8" y="98">body_number</text><text class="table-cell" x="8" y="111">queue_rank</text><text class="table-cell" x="8" y="124">geofence_status</text>
        </g>
        <g transform="translate(590, 70)">
            <rect width="240" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">terminals_3nf</text>
            <text class="table-cell-bold" x="8" y="34">PK: terminal_id</text>
            
            <text class="table-cell" x="8" y="46">terminal_name</text><text class="table-cell" x="8" y="59">anchor_latitude</text><text class="table-cell" x="8" y="72">anchor_longitude</text><text class="table-cell" x="8" y="85">geofence_radius</text>
        </g>
        <g transform="translate(590, 200)">
            <rect width="240" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">tariffs_3nf</text>
            <text class="table-cell-bold" x="8" y="34">PK: tariff_rates_3nf</text>
            
            <text class="table-cell" x="8" y="46">base_fare</text><text class="table-cell" x="8" y="59">per_km_rate</text><text class="table-cell" x="8" y="72">night_differential</text><text class="table-cell" x="8" y="85">effective_date</text>
        </g>
        <g transform="translate(310, 260)">
            <rect width="240" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">rides_3nf</text>
            <text class="table-cell-bold" x="8" y="34">PK: rides_3nf</text>
            <text class="flow-text" x="8" y="46">FK: passenger_id</text><text class="flow-text" x="8" y="59">FK: driver_id</text><text class="flow-text" x="8" y="72">FK: terminal_id</text><text class="flow-text" x="8" y="85">FK: tariff_id</text>
            <text class="table-cell" x="8" y="98">pickup_coords</text><text class="table-cell" x="8" y="111">dropoff_coords</text><text class="table-cell" x="8" y="124">distance_km</text><text class="table-cell" x="8" y="137">total_fare</text><text class="table-cell" x="8" y="150">ride_status</text><text class="table-cell" x="8" y="163">completed_at</text>
        </g>
        <g transform="translate(50, 360)">
            <rect width="220" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="220" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="110" y="14" text-anchor="middle">messages_3nf</text>
            <text class="table-cell-bold" x="8" y="34">PK: chat_messages_3nf</text>
            <text class="flow-text" x="8" y="46">FK: ride_id</text><text class="flow-text" x="8" y="59">FK: sender_id</text>
            <text class="table-cell" x="8" y="72">message_content</text><text class="table-cell" x="8" y="85">is_read</text><text class="table-cell" x="8" y="98">sent_at</text>
        </g>
        <g transform="translate(590, 340)">
            <rect width="240" height="135" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">reports_3nf</text>
            <text class="table-cell-bold" x="8" y="34">PK: incident_reports_3nf</text>
            <text class="flow-text" x="8" y="46">FK: ride_id</text><text class="flow-text" x="8" y="59">FK: reporter_id</text>
            <text class="table-cell" x="8" y="72">category</text><text class="table-cell" x="8" y="85">description</text><text class="table-cell" x="8" y="98">status</text><text class="table-cell" x="8" y="111">resolution</text>
        </g>
        <g transform="translate(310, 470)">
            <rect width="240" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">remittance_3nf</text>
            <text class="table-cell-bold" x="8" y="34">PK: remittance_ledger_3nf</text>
            <text class="flow-text" x="8" y="46">FK: driver_id</text><text class="flow-text" x="8" y="59">FK: collector_id</text>
            <text class="table-cell" x="8" y="72">daily_dues_amount</text><text class="table-cell" x="8" y="85">receipt_number</text><text class="table-cell" x="8" y="98">payment_date</text>
        </g>
        <g transform="translate(590, 495)">
            <rect width="240" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="14" text-anchor="middle">logs_3nf</text>
            <text class="table-cell-bold" x="8" y="34">PK: audit_logs_3nf</text>
            <text class="flow-text" x="8" y="46">FK: user_id</text>
            <text class="table-cell" x="8" y="59">action_type</text><text class="table-cell" x="8" y="72">payload_json</text><text class="table-cell" x="8" y="85">ip_address</text><text class="table-cell" x="8" y="98">timestamp</text>
        </g>
    <!-- roles_3nf -> users_3nf -->
    <path d="M 160 165 L 160 190" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- users_3nf -> drivers_3nf -->
    <path d="M 270 230 L 290 230 L 290 140 L 310 140" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- drivers_3nf -> rides_3nf -->
    <path d="M 430 230 L 430 260" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- terminals_3nf -> rides_3nf -->
    <path d="M 590 120 L 570 120 L 570 300 L 550 300" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- tariffs_3nf -> rides_3nf -->
    <path d="M 590 250 L 570 250 L 570 340 L 550 340" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- rides_3nf -> messages_3nf -->
    <path d="M 310 380 L 270 380" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- rides_3nf -> reports_3nf -->
    <path d="M 550 380 L 590 380" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- drivers_3nf -> remittance_3nf -->
    <path d="M 380 230 L 380 470" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- users_3nf -> logs_3nf -->
    <path d="M 160 330 L 160 620 L 710 620 L 710 615" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    
</svg>