<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 810" width="1150" height="810">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="1150" height="810" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 1. Conceptual Framework for SRH LINK-TODA (IPO Model + Agile SDLC)</text>
    </g>

    
        <g transform="translate(40, 80)">
            <rect width="300" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <text class="table-head" x="150" y="24" text-anchor="middle">PROBLEM STATEMENT</text>
            <line x1="10" y1="32" x2="290" y2="32" stroke="#000000" stroke-width="1"/>
            <text class="node-desc" x="15" y="60">• Unregulated terminal queue congestion</text>
            <text class="node-desc" x="15" y="85">• Passenger queue anxiety &amp; unfair cutting</text>
            <text class="node-desc" x="15" y="110">• Arbitrary fare charging without standard tariff</text>
            <text class="node-desc" x="15" y="135">• Inefficient manual paper dispatching at terminal</text>
        </g>
        <g transform="translate(800, 80)">
            <rect width="300" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <text class="table-head" x="150" y="24" text-anchor="middle">INPUT REQUIREMENTS</text>
            <line x1="10" y1="32" x2="290" y2="32" stroke="#000000" stroke-width="1"/>
            <text class="node-desc" x="15" y="60">• HTML5 Geolocation API (W3C Standard)</text>
            <text class="node-desc" x="15" y="85">• 35m Terminal Geofence (15.4247°N, 120.9416°E)</text>
            <text class="node-desc" x="15" y="110">• Municipal MTOP Franchising Guidelines</text>
            <text class="node-desc" x="15" y="135">• ISO/IEC 25010:2023 Quality Model &amp; TAM</text>
        </g>
        <g transform="translate(220, 310)">
            <rect width="700" height="210" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
            <text class="table-head" x="350" y="26" text-anchor="middle">PROCESS: 7-PHASE AGILE SDLC ENGINE</text>
            <line x1="15" y1="36" x2="685" y2="36" stroke="#000000" stroke-width="1"/>
            <g transform="translate(20, 55)">
                <text class="node-title" x="0" y="15">Phase 1: Planning &amp; Feasibility</text>
                <text class="node-desc" x="15" y="32">Terminal field observations, stakeholder alignment &amp; user stories</text>
                <text class="node-title" x="0" y="55">Phase 2: Requirements Analysis</text>
                <text class="node-desc" x="15" y="72">35m spatial threshold modeling, FIFO rules, ISO 25010 metrics</text>
                <text class="node-title" x="0" y="95">Phase 3: System Architecture &amp; DB Design</text>
                <text class="node-desc" x="15" y="112">3NF relational schema, REST API endpoints, Reverb WebSocket :8080</text>
                <text class="node-title" x="360" y="15">Phase 4: Full-Stack Implementation</text>
                <text class="node-desc" x="375" y="32">Ionic PWA, Laravel 11 API, Priority Recovery Algorithm</text>
                <text class="node-title" x="360" y="55">Phase 5: Verification &amp; Testing</text>
                <text class="node-desc" x="375" y="72">Haversine GPS boundary tests, load testing &amp; failover</text>
                <text class="node-title" x="360" y="95">Phase 6 &amp; 7: Deployment &amp; TAM Evaluation</text>
                <text class="node-desc" x="375" y="112">Live pilot at SRH Terminal &amp; empirical survey analysis</text>
            </g>
        </g>
        <g transform="translate(170, 570)">
            <rect width="800" height="135" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <text class="table-head" x="400" y="24" text-anchor="middle">OUTPUT: DEPLOYED SRH LINK-TODA PWA PLATFORM</text>
            <line x1="15" y1="32" x2="785" y2="32" stroke="#000000" stroke-width="1"/>
            <text class="node-desc" x="20" y="55">• Commuter PWA: Real-time terminal standby queue display &amp; metered fare booking</text>
            <text class="node-desc" x="20" y="75">• Driver Terminal PWA: HTML5 35m GPS duty check-in &amp; Priority Recovery Engine (Auto #1 Slot)</text>
            <text class="node-desc" x="20" y="95">• TODA Dispatcher &amp; Superadmin Hub: Queue overrides, MTOP compliance, remittance ledger &amp; audit trails</text>
            <text class="node-desc" x="20" y="115">• Validated Software Quality: ISO 25010 Overall Mean: 4.88 (Excellent) | TAM Acceptance: 4.86 (Strongly Agree)</text>
        </g>
        <g transform="translate(170, 740)">
            <rect width="800" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="node-title" x="400" y="25" text-anchor="middle">FEEDBACK LOOP: Agile Sprint Reviews, Driver Usability Tweaks &amp; Stakeholder Survey Evaluations</text>
        </g>
        <path d="M 190 260 L 190 310 L 220 310" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 950 260 L 950 310 L 920 310" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 570 520 L 570 570" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 170 640 L 100 640 L 100 415 L 220 415" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    
</svg>