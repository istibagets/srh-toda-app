<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-text { font-size: 10px; font-weight: normal; fill: #000000; }
            .store-text { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; font-family: 'Times New Roman', serif; }
            .table-cell { font-size: 10px; font-weight: normal; fill: #000000; font-family: 'Times New Roman', serif; }
            .table-cell-bold { font-size: 10px; font-weight: bold; fill: #000000; font-family: 'Times New Roman', serif; }
            .flow-text { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; }
            .flow-text-right { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="1120" height="680" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 14. Entity Relationship Diagram (ERD) of SRH LINK-TODA System</text>
    </g>

    
        <g transform="translate(50, 80)">
            <rect width="190" height="160" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="190" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="95" y="15" text-anchor="middle">USERS</text>
            <text class="table-cell-bold" x="8" y="38">PK: user_id</text>
            <text class="flow-text" x="8" y="52">FK: role_id</text>
            <text class="table-cell" x="8" y="66">full_name</text><text class="table-cell" x="8" y="80">email</text><text class="table-cell" x="8" y="94">contact_number</text><text class="table-cell" x="8" y="108">account_status</text><text class="table-cell" x="8" y="122">created_at</text>
        </g>
        <g transform="translate(50, 320)">
            <rect width="190" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="190" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="95" y="15" text-anchor="middle">ROLES</text>
            <text class="table-cell-bold" x="8" y="38">PK: role_id</text>
            
            <text class="table-cell" x="8" y="52">role_name</text><text class="table-cell" x="8" y="66">description</text>
        </g>
        <g transform="translate(300, 80)">
            <rect width="210" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="210" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="105" y="15" text-anchor="middle">DRIVERS</text>
            <text class="table-cell-bold" x="8" y="38">PK: driver_id</text>
            <text class="flow-text" x="8" y="52">FK: user_id</text>
            <text class="table-cell" x="8" y="66">mtop_number</text><text class="table-cell" x="8" y="80">plate_number</text><text class="table-cell" x="8" y="94">license_number</text><text class="table-cell" x="8" y="108">body_number</text><text class="table-cell" x="8" y="122">queue_rank</text><text class="table-cell" x="8" y="136">geofence_status</text>
        </g>
        <g transform="translate(300, 320)">
            <rect width="210" height="130" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="210" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="105" y="15" text-anchor="middle">TERMINALS</text>
            <text class="table-cell-bold" x="8" y="38">PK: terminal_id</text>
            
            <text class="table-cell" x="8" y="52">terminal_name</text><text class="table-cell" x="8" y="66">anchor_latitude</text><text class="table-cell" x="8" y="80">anchor_longitude</text><text class="table-cell" x="8" y="94">geofence_radius_meters</text>
        </g>
        <g transform="translate(300, 500)">
            <rect width="210" height="130" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="210" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="105" y="15" text-anchor="middle">TARIFF_RATES</text>
            <text class="table-cell-bold" x="8" y="38">PK: tariff_id</text>
            
            <text class="table-cell" x="8" y="52">base_fare</text><text class="table-cell" x="8" y="66">per_km_rate</text><text class="table-cell" x="8" y="80">night_differential</text><text class="table-cell" x="8" y="94">effective_date</text>
        </g>
        <g transform="translate(580, 80)">
            <rect width="220" height="210" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="220" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="110" y="15" text-anchor="middle">RIDES</text>
            <text class="table-cell-bold" x="8" y="38">PK: ride_id</text>
            <text class="flow-text" x="8" y="52">FK: passenger_id</text><text class="flow-text" x="8" y="66">FK: driver_id</text><text class="flow-text" x="8" y="80">FK: terminal_id</text><text class="flow-text" x="8" y="94">FK: tariff_id</text>
            <text class="table-cell" x="8" y="108">pickup_coords</text><text class="table-cell" x="8" y="122">dropoff_coords</text><text class="table-cell" x="8" y="136">distance_km</text><text class="table-cell" x="8" y="150">total_fare</text><text class="table-cell" x="8" y="164">ride_status</text><text class="table-cell" x="8" y="178">requested_at</text><text class="table-cell" x="8" y="192">completed_at</text>
        </g>
        <g transform="translate(860, 80)">
            <rect width="200" height="130" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="200" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="100" y="15" text-anchor="middle">CHAT_MESSAGES</text>
            <text class="table-cell-bold" x="8" y="38">PK: message_id</text>
            <text class="flow-text" x="8" y="52">FK: ride_id</text><text class="flow-text" x="8" y="66">FK: sender_id</text>
            <text class="table-cell" x="8" y="80">message_content</text><text class="table-cell" x="8" y="94">is_read</text><text class="table-cell" x="8" y="108">sent_at</text>
        </g>
        <g transform="translate(860, 250)">
            <rect width="200" height="150" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="200" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="100" y="15" text-anchor="middle">INCIDENT_REPORTS</text>
            <text class="table-cell-bold" x="8" y="38">PK: report_id</text>
            <text class="flow-text" x="8" y="52">FK: ride_id</text><text class="flow-text" x="8" y="66">FK: reporter_id</text>
            <text class="table-cell" x="8" y="80">report_category</text><text class="table-cell" x="8" y="94">description</text><text class="table-cell" x="8" y="108">report_status</text><text class="table-cell" x="8" y="122">resolution_notes</text><text class="table-cell" x="8" y="136">created_at</text>
        </g>
        <g transform="translate(580, 360)">
            <rect width="220" height="140" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="220" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="110" y="15" text-anchor="middle">REMITTANCE_LEDGER</text>
            <text class="table-cell-bold" x="8" y="38">PK: remittance_id</text>
            <text class="flow-text" x="8" y="52">FK: driver_id</text><text class="flow-text" x="8" y="66">FK: collector_id</text>
            <text class="table-cell" x="8" y="80">daily_dues_amount</text><text class="table-cell" x="8" y="94">receipt_number</text><text class="table-cell" x="8" y="108">payment_date</text><text class="table-cell" x="8" y="122">status</text>
        </g>
        <g transform="translate(860, 440)">
            <rect width="200" height="140" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="200" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="100" y="15" text-anchor="middle">AUDIT_LOGS</text>
            <text class="table-cell-bold" x="8" y="38">PK: log_id</text>
            <text class="flow-text" x="8" y="52">FK: user_id</text>
            <text class="table-cell" x="8" y="66">action_type</text><text class="table-cell" x="8" y="80">entity_affected</text><text class="table-cell" x="8" y="94">ip_address</text><text class="table-cell" x="8" y="108">created_at</text>
        </g>
    <!-- ROLES -> USERS -->
    <path d="M 145 320 L 145 240" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#crowsfoot-one)" marker-end="url(#crowsfoot-many)"/>
    
    <!-- USERS -> DRIVERS -->
    <path d="M 240 140 L 300 140" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#crowsfoot-one)" marker-end="url(#crowsfoot-one)"/>

    <!-- DRIVERS -> RIDES -->
    <path d="M 510 140 L 580 140" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#crowsfoot-one)" marker-end="url(#crowsfoot-many)"/>

    <!-- TERMINALS -> RIDES -->
    <path d="M 510 370 L 545 370 L 545 230 L 580 230" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#crowsfoot-one)" marker-end="url(#crowsfoot-many)"/>

    <!-- TARIFFS -> RIDES -->
    <path d="M 510 540 L 560 540 L 560 260 L 580 260" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#crowsfoot-one)" marker-end="url(#crowsfoot-many)"/>

    <!-- RIDES -> CHAT_MESSAGES -->
    <path d="M 800 140 L 860 140" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#crowsfoot-one)" marker-end="url(#crowsfoot-many)"/>

    <!-- RIDES -> INCIDENT_REPORTS -->
    <path d="M 800 230 L 830 230 L 830 310 L 860 310" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#crowsfoot-one)" marker-end="url(#crowsfoot-many)"/>

    <!-- DRIVERS -> REMITTANCE -->
    <path d="M 405 260 L 405 420 L 580 420" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#crowsfoot-one)" marker-end="url(#crowsfoot-many)"/>

    <!-- USERS -> AUDIT_LOGS -->
    <path d="M 145 80 L 145 40 L 960 40 L 960 440" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#crowsfoot-one)" marker-end="url(#crowsfoot-many)"/>
    
</svg>