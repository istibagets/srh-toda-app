<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 640" width="840" height="640">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-text { font-size: 10px; font-weight: normal; fill: #000000; }
            .store-text { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; font-family: 'Times New Roman', serif; }
            .table-cell { font-size: 10px; font-weight: normal; fill: #000000; font-family: 'Times New Roman', serif; }
            .table-cell-bold { font-size: 10px; font-weight: bold; fill: #000000; font-family: 'Times New Roman', serif; }
            .flow-text { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; }
            .flow-text-right { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="840" height="640" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 3. Agile Software Development Life Cycle (SDLC) and Evaluation Flowchart</text>
    </g>

    
        <g transform="translate(200, 80)">
            <rect width="440" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <text class="table-cell-bold" x="220" y="20" text-anchor="middle">Phase 1: Planning &amp; Feasibility</text>
            <text class="flow-text-center" x="220" y="38">Terminal observations, survey analysis, problem definition</text>
        </g>
            <path d="M 420 130 L 420 152" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
        <g transform="translate(200, 152)">
            <rect width="440" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <text class="table-cell-bold" x="220" y="20" text-anchor="middle">Phase 2: Requirements Engineering</text>
            <text class="flow-text-center" x="220" y="38">User stories, 35m geofence spec, ISO 25010 metrics</text>
        </g>
            <path d="M 420 202 L 420 224" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
        <g transform="translate(200, 224)">
            <rect width="440" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <text class="table-cell-bold" x="220" y="20" text-anchor="middle">Phase 3: Architectural &amp; DB Design</text>
            <text class="flow-text-center" x="220" y="38">Monochrome DFDs, ERD, 3NF schemas, class structures</text>
        </g>
            <path d="M 420 274 L 420 296" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
        <g transform="translate(200, 296)">
            <rect width="440" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <text class="table-cell-bold" x="220" y="20" text-anchor="middle">Phase 4: Full-Stack Implementation</text>
            <text class="flow-text-center" x="220" y="38">Ionic PWA, Laravel 11 REST API, Reverb WebSockets</text>
        </g>
            <path d="M 420 346 L 420 368" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
        <g transform="translate(200, 368)">
            <rect width="440" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <text class="table-cell-bold" x="220" y="20" text-anchor="middle">Phase 5: System Verification &amp; Testing</text>
            <text class="flow-text-center" x="220" y="38">Haversine GPS boundary tests, queue failover tests</text>
        </g>
            <path d="M 420 418 L 420 440" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
        <g transform="translate(200, 440)">
            <rect width="440" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <text class="table-cell-bold" x="220" y="20" text-anchor="middle">Phase 6: Deployment &amp; Field Pilot</text>
            <text class="flow-text-center" x="220" y="38">Live deployment at SRH Terminal with drivers &amp; commuters</text>
        </g>
            <path d="M 420 490 L 420 512" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
        <g transform="translate(200, 512)">
            <rect width="440" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <text class="table-cell-bold" x="220" y="20" text-anchor="middle">Phase 7: ISO 25010 &amp; TAM Evaluation</text>
            <text class="flow-text-center" x="220" y="38">Empirical survey evaluation (Drivers, Commuters, Admins)</text>
        </g>
    <!-- Iterative Feedback Loop -->
    <path d="M 640 540 L 720 540 L 720 180 L 640 180" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text class="flow-text" x="725" y="360" transform="rotate(90, 725, 360)" text-anchor="middle">Iterative Sprint Feedback &amp; Review</text>
    
</svg>