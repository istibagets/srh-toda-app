<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 600" width="1090" height="600">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-text { font-size: 10px; font-weight: normal; fill: #000000; }
            .store-text { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; font-family: 'Times New Roman', serif; }
            .table-cell { font-size: 10px; font-weight: normal; fill: #000000; font-family: 'Times New Roman', serif; }
            .table-cell-bold { font-size: 10px; font-weight: bold; fill: #000000; font-family: 'Times New Roman', serif; }
            .flow-text { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; }
            .flow-text-right { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="1090" height="600" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 20. Decoupled Progressive Web Application (PWA) System Architecture Diagram</text>
    </g>

    
    <!-- Layer 1: Client Tier -->
    <g transform="translate(50, 80)">
        <rect width="280" height="460" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
        <rect width="280" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="table-head" x="140" y="18" text-anchor="middle">PRESENTATION TIER (PWA)</text>

        <g transform="translate(15, 50)">
            <rect width="250" height="65" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-cell-bold" x="10" y="20">Commuter Mobile PWA</text>
            <text class="flow-text" x="10" y="38">• Live Terminal Queue Display</text>
            <text class="flow-text" x="10" y="52">• Fare Metering &amp; Booking Dispatch</text>
        </g>

        <g transform="translate(15, 130)">
            <rect width="250" height="65" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-cell-bold" x="10" y="20">Driver Terminal PWA</text>
            <text class="flow-text" x="10" y="38">• HTML5 35m Geofence Telemetry</text>
            <text class="flow-text" x="10" y="52">• FIFO Dispatch &amp; Priority Recovery</text>
        </g>

        <g transform="translate(15, 210)">
            <rect width="250" height="65" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-cell-bold" x="10" y="20">Administrative Web Console</text>
            <text class="flow-text" x="10" y="38">• TODA Queue &amp; MTOP Oversight</text>
            <text class="flow-text" x="10" y="52">• Municipal Tariff Calibration</text>
        </g>

        <g transform="translate(15, 290)">
            <rect width="250" height="65" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-cell-bold" x="10" y="20">Client Engine Technologies</text>
            <text class="flow-text" x="10" y="38">• MapLibre GL Vector Tile Renderer</text>
            <text class="flow-text" x="10" y="52">• Web Audio API Priority Chimes</text>
        </g>

        <g transform="translate(15, 370)">
            <rect width="250" height="65" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-cell-bold" x="10" y="20">Offline Service Worker</text>
            <text class="flow-text" x="10" y="38">• CacheStorage API &amp; Web Manifest</text>
            <text class="flow-text" x="10" y="52">• Resilient Offline Reconnect</text>
        </g>
    </g>

    <!-- Layer 2: API &amp; Realtime Tier -->
    <g transform="translate(380, 80)">
        <rect width="330" height="460" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
        <rect width="330" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="table-head" x="165" y="18" text-anchor="middle">APPLICATION &amp; REALTIME TIER</text>

        <g transform="translate(15, 50)">
            <rect width="300" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-cell-bold" x="10" y="20">Nginx Reverse Proxy &amp; Gateway</text>
            <text class="flow-text" x="10" y="38">• SSL/TLS Termination &amp; Rate Limiting</text>
        </g>

        <g transform="translate(15, 115)">
            <rect width="300" height="75" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-cell-bold" x="10" y="20">Laravel 11 REST API Framework</text>
            <text class="flow-text" x="10" y="38">• Sanctum Stateful Bearer Tokens</text>
            <text class="flow-text" x="10" y="52">• Eloquent ORM &amp; Policy Guards</text>
            <text class="flow-text" x="10" y="66">• Form Request Validation</text>
        </g>

        <g transform="translate(15, 205)">
            <rect width="300" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
            <text class="table-cell-bold" x="10" y="20">Core Algorithmic Engines</text>
            <text class="flow-text" x="10" y="38">• 35m Haversine Geofence Proximity Engine</text>
            <text class="table-cell-bold" x="10" y="54">• Priority Queue Recovery Engine</text>
            <text class="flow-text" x="20" y="68">(Auto-reinstates victim driver to #1 slot)</text>
            <text class="flow-text" x="10" y="84">• Distance-Tiered Municipal Tariff Engine</text>
            <text class="flow-text" x="10" y="98">• 6-Digit Email OTP Authentication</text>
        </g>

        <g transform="translate(15, 330)">
            <rect width="300" height="105" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-cell-bold" x="10" y="20">Laravel Reverb WebSocket Server</text>
            <text class="flow-text" x="10" y="38">• Dedicated Port :8080 Event Loop</text>
            <text class="flow-text" x="10" y="52">• Redis Pub/Sub Event Broadcast</text>
            <text class="flow-text" x="10" y="66">• Driver GPS Telemetry Broadcasting</text>
            <text class="flow-text" x="10" y="80">• Sub-100ms Instant Dispatch Alerting</text>
        </g>
    </g>

    <!-- Layer 3: Persistence Tier -->
    <g transform="translate(760, 80)">
        <rect width="280" height="460" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
        <rect width="280" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
        <text class="table-head" x="140" y="18" text-anchor="middle">DATA &amp; EXTERNAL SERVICES</text>

        <g transform="translate(15, 50)">
            <rect width="250" height="85" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-cell-bold" x="10" y="20">MariaDB 10.11 RDBMS</text>
            <text class="flow-text" x="10" y="38">• InnoDB Relational Storage Engine</text>
            <text class="flow-text" x="10" y="52">• 3NF Normalized Schema Integrity</text>
            <text class="flow-text" x="10" y="66">• Acid-Compliant Transactions</text>
            <text class="flow-text" x="10" y="80">• Spatial Coordinates &amp; Foreign Keys</text>
        </g>

        <g transform="translate(15, 150)">
            <rect width="250" height="75" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-cell-bold" x="10" y="20">Redis 7 In-Memory Store</text>
            <text class="flow-text" x="10" y="38">• Active Terminal Queue Caching</text>
            <text class="flow-text" x="10" y="52">• Ephemeral OTP Verification Store</text>
            <text class="flow-text" x="10" y="66">• High-Throughput Pub/Sub Broker</text>
        </g>

        <g transform="translate(15, 240)">
            <rect width="250" height="65" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-cell-bold" x="10" y="20">External Cloud Services</text>
            <text class="flow-text" x="10" y="38">• Gmail SMTP Service (OTP Delivery)</text>
            <text class="flow-text" x="10" y="52">• OpenStreetMap Tile CDN</text>
        </g>

        <g transform="translate(15, 320)">
            <rect width="250" height="115" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-cell-bold" x="10" y="20">System Audit &amp; Host OS</text>
            <text class="flow-text" x="10" y="38">• Ubuntu 24.04 LTS Cloud VPS</text>
            <text class="flow-text" x="10" y="52">• Immutable SHA-256 Activity Logs</text>
            <text class="flow-text" x="10" y="66">• Automated Daily Database Backups</text>
            <text class="flow-text" x="10" y="80">• Process Supervisor (Reverb &amp; Queue)</text>
        </g>
    </g>

    <!-- Connectors between tiers -->
    <path d="M 330 200 L 380 200" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text class="flow-text-center" x="355" y="190">HTTPS / REST</text>

    <path d="M 330 380 L 380 380" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text class="flow-text-center" x="355" y="370">WSS :8080</text>

    <path d="M 710 160 L 760 160" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text class="flow-text-center" x="735" y="150">SQL / PDO</text>

    <path d="M 710 370 L 760 210" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text class="flow-text-center" x="735" y="300">Redis Pub/Sub</text>
    
</svg>