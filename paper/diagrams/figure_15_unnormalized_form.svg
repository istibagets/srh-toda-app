<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" width="940" height="660">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-text { font-size: 10px; font-weight: normal; fill: #000000; }
            .store-text { font-size: 10px; font-weight: normal; fill: #000000; }
            .table-head { font-size: 11px; font-weight: bold; fill: #000000; font-family: 'Times New Roman', serif; }
            .table-cell { font-size: 10px; font-weight: normal; fill: #000000; font-family: 'Times New Roman', serif; }
            .table-cell-bold { font-size: 10px; font-weight: bold; fill: #000000; font-family: 'Times New Roman', serif; }
            .flow-text { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; }
            .flow-text-right { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; font-family: 'Times New Roman', serif; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="940" height="660" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 15. Unnormalized Form (UNF) of the SRH LINK-TODA Database Structure</text>
    </g>

    
    <!-- Outer Master Table (tbl_srh_toda_masterrecord) -->
    <rect x="80" y="60" width="780" height="560" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>

    <!-- Table Title Header -->
    <rect x="80" y="60" width="780" height="30" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="table-head" x="470" y="80" text-anchor="middle">tbl_srh_toda_masterrecord</text>

    <!-- Subheader PK row -->
    <rect x="80" y="90" width="780" height="25" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text class="table-cell-bold" x="100" y="107">PK</text>
    <line x1="130" y1="90" x2="130" y2="115" stroke="#000000" stroke-width="1"/>
    <text class="table-cell-bold" x="145" y="107">userID</text>

    <!-- Vertical Divider between scalar attributes and repeating groups -->
    <line x1="370" y1="115" x2="370" y2="620" stroke="#000000" stroke-width="1"/>

    <!-- Left Column: Scalar Attributes -->
    <g transform="translate(100, 135)">
        <text class="table-cell" x="0" y="0">fullName</text>
        <text class="table-cell" x="0" y="18">emailAddress</text>
        <text class="table-cell" x="0" y="36">contactNumber</text>
        <text class="table-cell" x="0" y="54">userRole</text>
        <text class="table-cell" x="0" y="72">roleID</text>
        <text class="table-cell" x="0" y="90">roleName</text>
        <text class="table-cell" x="0" y="108">accountStatus</text>
        <text class="table-cell" x="0" y="126">otpCode</text>
        <text class="table-cell" x="0" y="144">otpExpiresAt</text>
        <text class="table-cell" x="0" y="162">profilePhotoPath</text>
        <text class="table-cell" x="0" y="180">terminalID</text>
        <text class="table-cell" x="0" y="198">terminalName</text>
        <text class="table-cell" x="0" y="216">terminalLatitude</text>
        <text class="table-cell" x="0" y="234">terminalLongitude</text>
        <text class="table-cell" x="0" y="252">geofenceRadiusMeters</text>
        <text class="table-cell" x="0" y="270">tariffID</text>
        <text class="table-cell" x="0" y="288">baseFare</text>
        <text class="table-cell" x="0" y="306">baseDistanceKm</text>
        <text class="table-cell" x="0" y="324">perKmRate</text>
        <text class="table-cell" x="0" y="342">nightDifferentialMultiplier</text>
        <text class="table-cell" x="0" y="360">effectiveDate</text>
        <text class="table-cell" x="0" y="378">isTariffActive</text>
        <text class="table-cell" x="0" y="396">createdAt</text>
        <text class="table-cell" x="0" y="414">updatedAt</text>
    </g>

    <!-- Right Column: Repeating Groups with curly braces -->
    <g transform="translate(390, 135)">
        <!-- Driver Repeating Group -->
        <text class="table-cell" x="0" y="0">{ driverID, mtopNumber, plateNumber, licenseNumber,</text>
        <text class="table-cell" x="12" y="16">bodyNumber, driverContact, isAccredited, accreditationDate,</text>
        <text class="table-cell" x="12" y="32">queueRank, geofenceStatus, currentLatitude, currentLongitude,</text>
        <text class="table-cell" x="12" y="48">lastGeofencePingAt }</text>

        <!-- Ride Repeating Group -->
        <text class="table-cell" x="0" y="80">{ rideID, passengerID, pickupLatitude, pickupLongitude,</text>
        <text class="table-cell" x="12" y="96">pickupAddress, dropoffLatitude, dropoffLongitude,</text>
        <text class="table-cell" x="12" y="112">dropoffAddress, routeDistanceKm, estimatedFare, finalFare,</text>
        <text class="table-cell" x="12" y="128">paymentMethod, paymentStatus, rideStatus, cancellationReason,</text>
        <text class="table-cell" x="12" y="144">requestedAt, acceptedAt, completedAt }</text>

        <!-- Message Repeating Group -->
        <text class="table-cell" x="0" y="176">{ messageID, rideID, senderID, receiverID,</text>
        <text class="table-cell" x="12" y="192">messageContent, messageType, isRead, sentAt }</text>

        <!-- Incident Blotter Repeating Group -->
        <text class="table-cell" x="0" y="224">{ reportID, rideID, reporterID, reportedUserID,</text>
        <text class="table-cell" x="12" y="240">reportCategory, incidentDescription, incidentLocation,</text>
        <text class="table-cell" x="12" y="256">evidenceAttachment, reportStatus, resolutionNotes,</text>
        <text class="table-cell" x="12" y="272">resolvedBy, reportedAt, resolvedAt }</text>

        <!-- Remittance Repeating Group -->
        <text class="table-cell" x="0" y="304">{ remittanceID, driverID, collectorID, dailyDuesAmount,</text>
        <text class="table-cell" x="12" y="320">receiptNumber, paymentDate, remittanceStatus, remittanceNotes }</text>

        <!-- Audit Log Repeating Group -->
        <text class="table-cell" x="0" y="352">{ auditLogID, actorID, actionType, entityAffected,</text>
        <text class="table-cell" x="12" y="368">ipAddress, userAgent, statePayloadJson, logTimestamp }</text>
    </g>
    
</svg>