<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            text { font-family: 'Times New Roman', Times, serif; }
            .fig-title { font-size: 13px; font-weight: bold; font-style: italic; fill: #000000; }
            .header-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .entity-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-num { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .process-title { font-size: 11px; font-weight: normal; fill: #000000; text-anchor: middle; }
            .node-title { font-size: 11px; font-weight: bold; fill: #000000; }
            .node-desc { font-size: 10px; font-weight: normal; fill: #000000; }
            .store-id { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
            .store-name { font-size: 10.5px; font-weight: normal; fill: #000000; }
            .flow-text { font-size: 9px; fill: #000000; }
            .flow-text-right { font-size: 9px; fill: #000000; text-anchor: end; }
            .flow-text-center { font-size: 9px; fill: #000000; text-anchor: middle; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
        </marker>
        <marker id="crowsfoot-one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 5 0 L 5 10 M 8 0 L 8 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
        <marker id="crowsfoot-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 M 10 0 L 10 10" stroke="#000000" stroke-width="1.2" fill="none" />
        </marker>
    </defs>
    <!-- Pure White Background -->
    <rect width="1080" height="720" fill="#FFFFFF"/>
    
    <!-- Figure Header -->
    <g transform="translate(30, 25)">
        <text class="fig-title" x="0" y="0">Figure 19. System Class Diagram (SRH LINK-TODA Domain Architecture)</text>
    </g>

    
        <g transform="translate(50, 80)">
            <rect width="240" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="15" text-anchor="middle">User</text>
            <text class="node-desc" x="8" y="38">+ id: int</text><text class="node-desc" x="8" y="51">+ name: string</text><text class="node-desc" x="8" y="64">+ email: string</text><text class="node-desc" x="8" y="77">+ contact_number: string</text><text class="node-desc" x="8" y="90">+ role: string</text><text class="node-desc" x="8" y="103">+ is_active: bool</text>
            <line x1="0" y1="118" x2="240" y2="118" stroke="#000000" stroke-width="1"/>
            <text class="node-desc" x="8" y="132">+ isVerified(): bool</text><text class="node-desc" x="8" y="145">+ getAvatarUrl(): string</text><text class="node-desc" x="8" y="158">+ getAverageRating(): float</text>
        </g>
        <g transform="translate(350, 80)">
            <rect width="260" height="200" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="260" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="130" y="15" text-anchor="middle">Driver</text>
            <text class="node-desc" x="8" y="38">+ id: int</text><text class="node-desc" x="8" y="51">+ user_id: int</text><text class="node-desc" x="8" y="64">+ mtop_number: string</text><text class="node-desc" x="8" y="77">+ plate_number: string</text><text class="node-desc" x="8" y="90">+ compliance_status: string</text><text class="node-desc" x="8" y="103">+ is_online: bool</text><text class="node-desc" x="8" y="116">+ queue_position: int</text>
            <line x1="0" y1="131" x2="260" y2="131" stroke="#000000" stroke-width="1"/>
            <text class="node-desc" x="8" y="145">+ rides(): HasMany</text><text class="node-desc" x="8" y="158">+ getAverageRating(): float</text><text class="node-desc" x="8" y="171">+ isCompliant(): bool</text>
        </g>
        <g transform="translate(670, 80)">
            <rect width="290" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="290" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="145" y="15" text-anchor="middle">QueueService</text>
            <text class="node-desc" x="8" y="38">- lastNormalizedAt: Carbon</text><text class="node-desc" x="8" y="51">- broadcastChannel: string</text>
            <line x1="0" y1="66" x2="290" y2="66" stroke="#000000" stroke-width="1"/>
            <text class="node-desc" x="8" y="80">+ removeAndShift(driver: Driver): void</text><text class="node-desc" x="8" y="93">+ insertAtFront(driver: Driver): void</text><text class="node-desc" x="8" y="106">+ normalizeQueue(): void</text><text class="node-desc" x="8" y="119">+ reorderQueue(orderedIds: array): void</text><text class="node-desc" x="8" y="132">- notifyQueueChanged(): void</text>
        </g>
        <g transform="translate(350, 340)">
            <rect width="260" height="200" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="260" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="130" y="15" text-anchor="middle">Ride</text>
            <text class="node-desc" x="8" y="38">+ id: int</text><text class="node-desc" x="8" y="51">+ passenger_id: int</text><text class="node-desc" x="8" y="64">+ driver_id: int</text><text class="node-desc" x="8" y="77">+ fare: decimal</text><text class="node-desc" x="8" y="90">+ proposed_fare: decimal</text><text class="node-desc" x="8" y="103">+ distance_km: decimal</text><text class="node-desc" x="8" y="116">+ status: string</text>
            <line x1="0" y1="131" x2="260" y2="131" stroke="#000000" stroke-width="1"/>
            <text class="node-desc" x="8" y="145">+ passenger(): BelongsTo</text><text class="node-desc" x="8" y="158">+ driver(): BelongsTo</text><text class="node-desc" x="8" y="171">+ chatMessages(): HasMany</text><text class="node-desc" x="8" y="184">+ reports(): HasMany</text>
        </g>
        <g transform="translate(50, 340)">
            <rect width="240" height="140" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="15" text-anchor="middle">ChatMessage</text>
            <text class="node-desc" x="8" y="38">+ id: int</text><text class="node-desc" x="8" y="51">+ ride_id: int</text><text class="node-desc" x="8" y="64">+ sender_id: int</text><text class="node-desc" x="8" y="77">+ message: string</text><text class="node-desc" x="8" y="90">+ is_read: bool</text>
            <line x1="0" y1="105" x2="240" y2="105" stroke="#000000" stroke-width="1"/>
            <text class="node-desc" x="8" y="119">+ ride(): BelongsTo</text><text class="node-desc" x="8" y="132">+ sender(): BelongsTo</text>
        </g>
        <g transform="translate(670, 340)">
            <rect width="290" height="160" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="290" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="145" y="15" text-anchor="middle">Report</text>
            <text class="node-desc" x="8" y="38">+ id: int</text><text class="node-desc" x="8" y="51">+ reporter_id: int</text><text class="node-desc" x="8" y="64">+ driver_id: int</text><text class="node-desc" x="8" y="77">+ ride_id: int</text><text class="node-desc" x="8" y="90">+ type: string</text><text class="node-desc" x="8" y="103">+ status: string</text>
            <line x1="0" y1="118" x2="290" y2="118" stroke="#000000" stroke-width="1"/>
            <text class="node-desc" x="8" y="132">+ reporter(): BelongsTo</text><text class="node-desc" x="8" y="145">+ driver(): BelongsTo</text><text class="node-desc" x="8" y="158">+ ride(): BelongsTo</text>
        </g>
        <g transform="translate(50, 530)">
            <rect width="240" height="130" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="240" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="120" y="15" text-anchor="middle">UserActivityLog</text>
            <text class="node-desc" x="8" y="38">+ id: int</text><text class="node-desc" x="8" y="51">+ user_id: int</text><text class="node-desc" x="8" y="64">+ action: string</text><text class="node-desc" x="8" y="77">+ ip_address: string</text><text class="node-desc" x="8" y="90">+ created_at: datetime</text>
            <line x1="0" y1="105" x2="240" y2="105" stroke="#000000" stroke-width="1"/>
            <text class="node-desc" x="8" y="119">+ user(): BelongsTo</text>
        </g>
        <g transform="translate(670, 530)">
            <rect width="290" height="130" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
            <rect width="290" height="22" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
            <text class="table-head" x="145" y="15" text-anchor="middle">OtpService</text>
            <text class="node-desc" x="8" y="38">- cacheTtl: int = 300</text>
            <line x1="0" y1="53" x2="290" y2="53" stroke="#000000" stroke-width="1"/>
            <text class="node-desc" x="8" y="67">+ sendOtp(user: User): bool</text><text class="node-desc" x="8" y="80">+ verifyOtp(email: string, otp: string): bool</text>
        </g>
    <path d="M 290 150 L 350 150" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 610 150 L 670 150" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 480 280 L 480 340" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 350 410 L 290 410" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 610 410 L 670 410" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 170 260 L 170 530" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    
</svg>